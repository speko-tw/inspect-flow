# Alembic configuration for the InspectFlow backend (DBF-R02).
#
# Paths use %(here)s (this file's directory), so `alembic` works
# from any working directory, e.g.
#   cd backend && uv run alembic upgrade head
#   uv run --project backend alembic -c backend/alembic.ini \
#     upgrade head

[alembic]
script_location = %(here)s/alembic

# Makes the `app` package importable from env.py regardless of the
# current working directory.
prepend_sys_path = %(here)s
path_separator = os

# sqlalchemy.url is deliberately left unset: env.py resolves the
# connection URL via app.db.settings.get_database_url(), the same
# INSPECTFLOW_DATABASE_URL environment variable the application
# reads, so `alembic` and the app always agree on the target
# database. Setting it here would create a second, divergent
# source of truth.

[post_write_hooks]
# `alembic revision` renders ids with repr() (single quotes);
# format each new script with ruff so it passes `make check`
# unchanged.
hooks = ruff_format
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
