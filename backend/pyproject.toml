[project]
name = "inspect-flow-backend"
version = "0.1.0"
description = "InspectFlow backend (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    # Upgrading fastapi: re-check test_route_conventions.py's
    # _iter_business_routes (internal effective_candidates(), API-AC01).
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
include = ["app", "tests", "alembic"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--strict-markers"
# The `sqlite_only` marker (backend/tests/db/conftest.py) is
# registered programmatically via pytest_configure's
# addinivalue_line rather than declared here, since it is the only
# custom marker and lives right next to the fixture that acts on
# it.
