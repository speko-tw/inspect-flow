<!-- #429 approved design reference; the trial dock is removed. -->
<title>專案查核項目與範本庫</title>
<style>
:root {
  --bg: #f3f5f8;
  --fg: #1b2430;
  --surface: #ffffff;
  --surface-alt: #f7f9fb;
  --muted: #526071;
  --border: #d3dae3;
  --border-strong: #7d8a9a;
  --primary: #1b5ec2;
  --primary-hover: #154c9e;
  --on-primary: #ffffff;
  --danger: #b3261e;
  --danger-hover: #8f1d17;
  --on-danger: #ffffff;
  --error-bg: #fdeceb;
  --error-text: #8c1d18;
  --error-border: #e9a7a3;
  --ok-bg: #e8f6ee;
  --ok-text: #14532d;
  --ok-border: #9fd3b4;
  --warn-bg: #fff4dc;
  --warn-text: #5c3d00;
  --warn-border: #e2c071;
  --sel-bg: #e6effb;
  --focus: #1b5ec2;
  --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151c;
    --fg: #e7ecf2;
    --surface: #19202a;
    --surface-alt: #1e2631;
    --muted: #a6b2c0;
    --border: #2d3745;
    --border-strong: #6b7a8c;
    --primary: #7db3ff;
    --primary-hover: #a3c8ff;
    --on-primary: #0a1424;
    --danger: #ff9b92;
    --danger-hover: #ffb9b2;
    --on-danger: #2a0a07;
    --error-bg: #3a1613;
    --error-text: #ffb4ac;
    --error-border: #7a3029;
    --ok-bg: #12301f;
    --ok-text: #a9e8c3;
    --ok-border: #2c6b46;
    --warn-bg: #33290f;
    --warn-text: #f3d994;
    --warn-border: #6b5520;
    --sel-bg: #1c2d47;
    --focus: #8fbfff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151c;
  --fg: #e7ecf2;
  --surface: #19202a;
  --surface-alt: #1e2631;
  --muted: #a6b2c0;
  --border: #2d3745;
  --border-strong: #6b7a8c;
  --primary: #7db3ff;
  --primary-hover: #a3c8ff;
  --on-primary: #0a1424;
  --danger: #ff9b92;
  --danger-hover: #ffb9b2;
  --on-danger: #2a0a07;
  --error-bg: #3a1613;
  --error-text: #ffb4ac;
  --error-border: #7a3029;
  --ok-bg: #12301f;
  --ok-text: #a9e8c3;
  --ok-border: #2c6b46;
  --warn-bg: #33290f;
  --warn-text: #f3d994;
  --warn-border: #6b5520;
  --sel-bg: #1c2d47;
  --focus: #8fbfff;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-sans);
  font-size: 1rem;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}
form h2 { margin-bottom: 14px; }
h1, h2, h3, h4 { margin: 0 0 8px; line-height: 1.3; overflow-wrap: anywhere; }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.05rem; }
p { margin: 0 0 8px; }
ul, ol { margin: 0; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }

.shell { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.wrap { flex: 1; width: 100%; max-width: 76rem; margin-inline: auto; padding-inline: 16px; padding-block: 0 24px; min-width: 0; }

/* header */
.top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding-block: 12px; border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 8px; font-size: 1.1rem; }
.tag { font-size: .75rem; padding: 0 8px; border: 1px solid var(--warn-border); background: var(--warn-bg); color: var(--warn-text); border-radius: 3px; }
.top-act { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.chip { font-size: .9rem; padding: 3px 10px; border: 1px solid var(--border-strong); border-radius: 3px; background: var(--surface); }
.banner { margin-block: 12px 0; padding: 8px 12px; border: 1px solid var(--warn-border); background: var(--warn-bg); color: var(--warn-text); font-size: .9rem; border-radius: 4px; }
.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border); margin-block: 12px 16px; }
.tab { padding: 8px 16px; border: 0; border-bottom: 3px solid transparent; margin-bottom: -2px; background: none; color: var(--muted); font: inherit; cursor: pointer; min-height: 44px; }
.tab:hover { color: var(--fg); }
.tab[aria-current="page"] { color: var(--fg); border-bottom-color: var(--primary); font-weight: 700; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 6px 14px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--fg); border-radius: 4px; font: inherit; cursor: pointer; text-align: center; }
.btn:hover { background: var(--surface-alt); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); font-weight: 600; }
.btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.btn.danger.solid { background: var(--danger); color: var(--on-danger); }
.btn.danger.solid:hover { background: var(--danger-hover); }
.btn.sm { min-height: 34px; padding: 2px 10px; font-size: .9rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }

/* layout */
.mgr { display: grid; grid-template-columns: minmax(240px, 320px) minmax(0, 1fr); gap: 16px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 5px; padding: 16px; min-width: 0; margin-bottom: 16px; }
.mgr > .panel { margin-bottom: 0; }
.detailcol { min-width: 0; }
.list-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.list-head h2 { margin: 0; font-size: 1.1rem; }
.only-mobile { display: none; }
.openbtn { display: none; }

/* tree */
.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree ul { margin-left: 14px; padding-left: 6px; border-left: 1px solid var(--border); }
.rowwrap { display: flex; align-items: center; gap: 4px; }
.row { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 6px 8px; min-height: 40px; border: 0; border-left: 3px solid transparent; background: none; color: inherit; font: inherit; cursor: pointer; border-radius: 3px; }
.row:hover { background: var(--surface-alt); }
.row.is-sel { background: var(--sel-bg); border-left-color: var(--primary); font-weight: 700; }
.row.is-ctx { border-left-color: var(--border-strong); }
.chev { flex: none; width: 0; height: 0; border-style: solid; border-width: 5px 0 5px 7px; border-color: transparent transparent transparent var(--muted); transition: transform .1s; }
.row[aria-expanded="true"] .chev, .pt.open .chev { transform: rotate(90deg); }
.chev.none { border: 0; width: 7px; height: 7px; border-radius: 50%; background: var(--border-strong); opacity: .6; margin-inline: 1px; }
.lbl { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.cnt { flex: none; font-size: .8rem; font-weight: 400; color: var(--muted); border: 1px solid var(--border); border-radius: 10px; padding: 0 7px; background: var(--surface-alt); }
.empty-sm { color: var(--muted); font-size: .92rem; margin: 4px 0 8px; }
.empty { padding: 24px 8px; text-align: center; }
.empty p { color: var(--muted); }

/* notices / guard / confirm */
.notice { padding: 10px 12px; border: 1px solid; border-radius: 4px; margin-bottom: 12px; overflow-wrap: anywhere; }
.notice.ok { background: var(--ok-bg); color: var(--ok-text); border-color: var(--ok-border); }
.notice.err { background: var(--error-bg); color: var(--error-text); border-color: var(--error-border); }
.notice.info { background: var(--sel-bg); border-color: var(--border-strong); }
.guard { position: sticky; top: 0; z-index: 20; margin-bottom: 12px; padding: 12px; border: 2px solid var(--warn-border); background: var(--warn-bg); color: var(--warn-text); border-radius: 4px; }
.guard .btn { color: var(--fg); }
.confirm { border: 2px solid var(--danger); border-radius: 4px; padding: 12px; margin-bottom: 12px; background: var(--surface-alt); }
.inline-confirm { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* detail */
.crumb { font-size: .88rem; color: var(--muted); margin-bottom: 4px; overflow-wrap: anywhere; }
.kindtag { font-size: .8rem; color: var(--muted); margin-bottom: 2px; }
.detail-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 16px; }
.childlist { list-style: none; padding: 0; margin: 0 0 12px; }
.childlist li { margin-bottom: 6px; }
.childbtn { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; min-height: 40px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: inherit; font: inherit; cursor: pointer; }
.childbtn:hover { background: var(--surface-alt); }
.hint { color: var(--muted); font-size: .88rem; margin: 4px 0 8px; }

/* forms */
label, .lab { display: block; font-weight: 600; font-size: .92rem; margin-bottom: 4px; }
.req { color: var(--danger); }
input[type="text"], select, textarea { display: block; width: 100%; min-height: 40px; padding: 6px 10px; border: 1px solid var(--border-strong); border-radius: 4px; background: var(--surface); color: var(--fg); font: inherit; }
textarea { min-height: 64px; resize: vertical; }
[aria-invalid="true"] { border-color: var(--danger) !important; box-shadow: 0 0 0 1px var(--danger); }
.field-error { color: var(--error-text); font-size: .88rem; margin-top: 4px; font-weight: 600; overflow-wrap: anywhere; }
.fg { margin-bottom: 12px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0 12px; }
.opt { display: inline-flex; align-items: center; gap: 6px; font-weight: 400; margin: 0 16px 4px 0; min-height: 34px; cursor: pointer; font-size: 1rem; }
.opt input { width: 18px; height: 18px; margin: 0; accent-color: var(--primary); }
.valrow { display: flex; align-items: flex-start; gap: 6px; }
.valrow > .inp { flex: 1; min-width: 0; }
.suffix { flex: none; min-width: 3ch; padding-top: 8px; color: var(--muted); font-size: .92rem; }
.using { margin: 0 0 12px; padding: 8px 10px; background: var(--sel-bg); border-radius: 4px; border: 1px solid var(--border); }

.sec { margin-bottom: 20px; }
.sec > h3 { padding-bottom: 4px; border-bottom: 1px solid var(--border); }
.pt { border: 1px solid var(--border-strong); border-radius: 5px; margin-bottom: 12px; background: var(--surface); }
.pt-h { display: flex; align-items: stretch; gap: 8px; background: var(--surface-alt); border-radius: 5px 5px 0 0; }
.pt:not(.open) .pt-h { border-radius: 5px; }
.pt-toggle { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; text-align: left; padding: 10px 12px; background: none; border: 0; color: inherit; font: inherit; cursor: pointer; border-radius: 5px; }
.pt-toggle .pt-name { font-weight: 700; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.pt-sum { flex-basis: 100%; color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; padding-left: 17px; }
.pt.open .pt-sum { display: none; }
.badge { align-self: center; margin-right: 10px; font-size: .82rem; font-weight: 700; padding: 1px 8px; border-radius: 3px; background: var(--error-bg); color: var(--error-text); border: 1px solid var(--error-border); white-space: nowrap; }
.pt-body { padding: 12px; border-top: 1px solid var(--border); }
fieldset.blk { border: 1px solid var(--border); border-radius: 4px; padding: 8px 12px 6px; margin: 0 0 14px; min-width: 0; }
fieldset.blk > legend { font-weight: 700; padding: 0 6px; }
.fld { border-bottom: 1px dashed var(--border); margin-bottom: 8px; padding-bottom: 6px; }
.fld-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0 12px; }
.fld-act { margin-bottom: 6px; }
.form-foot { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding-top: 12px; border-top: 1px solid var(--border); }
.err-sum { color: var(--error-text); font-weight: 700; }
details.pv { border: 1px solid var(--border); border-radius: 4px; padding: 0 12px; margin-bottom: 16px; background: var(--surface-alt); }
details.pv > summary { cursor: pointer; font-weight: 700; min-height: 40px; display: flex; align-items: center; }
.pv-body { padding-bottom: 10px; }
.pv-body ol, .prev-items { padding-left: 20px; }
.pv-body li, .prev-items li { margin-bottom: 4px; overflow-wrap: anywhere; }
pre { overflow: auto; max-width: 100%; background: var(--surface-alt); border: 1px solid var(--border); border-radius: 4px; padding: 10px; font-family: var(--font-mono); font-size: .82rem; line-height: 1.45; }

/* view */
.vpt { border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; margin-bottom: 10px; }
.vpt h4 { margin: 0 0 4px; }
.vpt dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; }
.vpt dt { color: var(--muted); }
.vpt dd { margin: 0; overflow-wrap: anywhere; }

/* apply / project */
.plist { list-style: none; padding: 0; margin: 0; }
.plist li { border: 1px solid var(--border); border-radius: 4px; padding: 8px 12px; margin-bottom: 8px; }
.plist .pn { font-weight: 700; display: block; overflow-wrap: anywhere; }
.plist .pm { color: var(--muted); font-size: .9rem; display: block; overflow-wrap: anywhere; }
.recent { outline: 2px solid var(--ok-border); }

.project-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.project-card { border: 1px solid var(--border); border-radius: 5px; padding: 16px; background: var(--surface); }
.project-card .btn { margin-top: 8px; }
.destination { border: 1px solid var(--border); background: var(--surface-alt); padding: 12px; margin-bottom: 12px; border-radius: 4px; }

@media (max-width: 640px) {
  .mgr { grid-template-columns: minmax(0, 1fr); }
  .mgr[data-pane="detail"] > .listcol { display: none; }
  .mgr[data-pane="list"] > .detailcol { display: none; }
  .only-mobile { display: inline-flex; }
  .openbtn { display: inline-flex; flex: none; }
  .panel { padding: 12px; }
  .vpt dl { grid-template-columns: 1fr; }
  .top { padding-block: 8px; }
  .tabs { overflow-x: auto; }
  .tab { flex: none; padding-inline: 10px; }
  .project-card .btn { width: 100%; }
}
</style>

<div class="shell">
  <div class="wrap" id="app"></div>
</div>

<script>
(function () {
'use strict';

/* ---------- 小工具 ---------- */
var seq = 0;
function uid(p) { seq += 1; return p + seq; }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function T(s) { return String(s == null ? '' : s).trim(); }
function norm(s) { return String(s == null ? '' : s).replace(/\s+/g, '').toLowerCase(); }
function el(id) { return document.getElementById(id); }
function isMobile() { return window.matchMedia('(max-width: 640px)').matches; }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* 略過 */ } }
function idp(path) { return path.replace(/:/g, '-'); }
function iid(path) { return 'in-' + idp(path); }
function slot(path) {
  return '<div class="field-error" id="err-' + idp(path) + '" data-err="' + path + '" hidden></div>';
}
var KIND = { cat: '工程類別', sys: '系統', item: '查核項目' };
var OPHINT = {
  le: '量測值不得超過標準值。例如：坡度不得超過 3 %。',
  ge: '量測值不得低於標準值。例如：水壓不得低於 0.6 MPa。',
  eq: '量測值要等於標準值，可再填容許誤差。例如：厚度 10 mm，誤差 ±1。',
  range: '量測值要落在一段範圍內。可用「區間」或「標準值 ± 容許誤差」表示。'
};
var STDHINT = {
  none: '只記錄量測結果，不自動判定合格與否。',
  text: '用一句話描述合格的樣子，例如「無滲漏」。',
  numeric: '用數字欄位的量測值判定，例如坡度要落在 1～3 % 之間。'
};

/* ---------- 狀態 ---------- */
var S = {
  tab: 'mgr',
  lib: [], proj: [], projectData: { A: [], B: [] }, activeProject: 'A', expanded: {},
  sel: null, mode: 'view', create: null,
  nameDraft: '', nameBase: '', nameErr: '',
  draft: null, baseline: '', attempted: false,
  notice: null, guard: null, pane: 'list',
  previewOpen: true, fieldBlock: null, confirmRemove: null,
  aSel: null, aTarget: '', aNotice: null, aConfirm: false, aPane: 'list', lastApplied: [],
  saveSource: null, saveNotice: null, savePane: 'list',
};
var app = el('app');

/* ---------- 資料模型（草稿與存檔格式） ---------- */
function newField(type) { return { key: uid('f'), name: '', type: type || 'number', unit: '' }; }
function newPoint() {
  return { key: uid('p'), open: true, title: '', desc: '', fields: [],
    std: { kind: 'none', text: '', fieldKey: '', op: 'range', form: 'interval', lo: '', hi: '', target: '', tol: '' },
    photos: '1' };
}
function blankDraft() { return { name: '', desc: '', points: [newPoint()] }; }
function snap(d) { return JSON.stringify(d, function (k, v) { return k === 'open' ? undefined : v; }); }
function numStr(v) { return v == null ? '' : String(v); }

function toModel(D) {
  return {
    name: T(D.name), desc: T(D.desc),
    points: D.points.map(function (p) {
      var bound = p.std.kind === 'numeric' ? p.std.fieldKey : '';
      var bf = p.fields.filter(function (f) { return f.key === bound; })[0];
      var s = { kind: p.std.kind };
      if (p.std.kind === 'text') { s.text = T(p.std.text); }
      if (p.std.kind === 'numeric') {
        s.fieldKey = bound; s.unit = bf ? T(bf.unit) : ''; s.op = p.std.op;
        if (p.std.op === 'range') {
          s.form = p.std.form;
          if (p.std.form === 'interval') { s.lo = Number(T(p.std.lo)); s.hi = Number(T(p.std.hi)); }
          else { s.target = Number(T(p.std.target)); s.tol = Number(T(p.std.tol)); }
        } else if (p.std.op === 'eq') {
          s.target = Number(T(p.std.target)); s.tol = T(p.std.tol) === '' ? null : Number(T(p.std.tol));
        } else { s.target = Number(T(p.std.target)); }
      }
      return {
        title: T(p.title), desc: T(p.desc),
        fields: p.fields.map(function (f) {
          return { key: f.key, name: T(f.name), type: f.type, unit: (f.type === 'number' && f.key !== bound) ? T(f.unit) : null };
        }),
        std: s, photos: parseInt(T(p.photos), 10)
      };
    })
  };
}
function toDraft(m) {
  return {
    name: m.name, desc: m.desc || '',
    points: m.points.map(function (p, i) {
      var bound = p.std.kind === 'numeric' ? p.std.fieldKey : '';
      return {
        key: uid('p'), open: i === 0, title: p.title, desc: p.desc || '',
        fields: p.fields.map(function (f) {
          return { key: f.key, name: f.name, type: f.type, unit: f.key === bound ? (p.std.unit || '') : (f.unit || '') };
        }),
        std: {
          kind: p.std.kind, text: p.std.text || '', fieldKey: bound, op: p.std.op || 'range', form: p.std.form || 'interval',
          lo: numStr(p.std.lo), hi: numStr(p.std.hi), target: numStr(p.std.target), tol: numStr(p.std.tol)
        },
        photos: String(p.photos)
      };
    })
  };
}
function wire(m) {
  return {
    name: m.name, description: m.desc,
    points: m.points.map(function (p) {
      var o = {
        title: p.title,
        measurement_fields: p.fields.map(function (f) { return { name: f.name, type: f.type, unit: f.unit }; }),
        min_photos: p.photos
      };
      if (p.std.kind === 'text') { o.text_standard = p.std.text; }
      if (p.std.kind === 'numeric') {
        var bf = p.fields.filter(function (f) { return f.key === p.std.fieldKey; })[0];
        var n = { field: bf ? bf.name : null, unit: p.std.unit, op: p.std.op };
        ['form', 'lo', 'hi', 'target', 'tol'].forEach(function (k) { if (p.std[k] !== undefined) { n[k] = p.std[k]; } });
        o.numeric_standard = n;
      }
      return o;
    })
  };
}

/* ---------- 白話摘要 ---------- */
function boundField(p) { return p.fields.filter(function (f) { return f.key === p.std.fieldKey; })[0] || null; }
function unitOf(p) { var f = boundField(p); return f ? T(f.unit) : ''; }
function vt(v) { return T(v) || '？'; }
function fieldLabel(f) {
  var n = T(f.name) || '（未命名欄位）';
  return f.type === 'number' ? n + '（' + (T(f.unit) || '單位未填') + '）' : n;
}
function stdShort(p) {
  var s = p.std, u = unitOf(p), U = u ? ' ' + u : '';
  if (s.kind === 'none') { return '不判定'; }
  if (s.kind === 'text') { return '文字：' + (T(s.text) || '（未填）'); }
  if (s.op === 'range') {
    return s.form === 'interval' ? vt(s.lo) + '～' + vt(s.hi) + U : vt(s.target) + ' ± ' + vt(s.tol) + U;
  }
  if (s.op === 'le') { return '≤ ' + vt(s.target) + U; }
  if (s.op === 'ge') { return '≥ ' + vt(s.target) + U; }
  return '＝ ' + vt(s.target) + (T(s.tol) ? ' ± ' + T(s.tol) : '') + U;
}
function pointSummary(p) {
  var f = p.fields.length ? '量測 ' + p.fields.map(fieldLabel).join('、') : '無實測欄位';
  return [T(p.title) || '（未命名項次）', f, stdShort(p), '照片 ' + (T(p.photos) || '？') + ' 張'].join('｜');
}
function plain(p) {
  var s = p.std, title = T(p.title) || '（未命名項次）';
  if (s.kind === 'none') { return title + '：只記錄，不判定'; }
  if (s.kind === 'text') { return title + '：' + (T(s.text) || '（未填）'); }
  var bf = boundField(p), nm = (bf && T(bf.name)) || title, u = unitOf(p), U = u ? ' ' + u : '';
  if (s.op === 'range') {
    return s.form === 'interval' ? nm + ' ' + vt(s.lo) + '～' + vt(s.hi) + U : nm + ' ' + vt(s.target) + ' ± ' + vt(s.tol) + U;
  }
  if (s.op === 'le') { return nm + ' 不超過 ' + vt(s.target) + U; }
  if (s.op === 'ge') { return nm + ' 不低於 ' + vt(s.target) + U; }
  return nm + ' 等於 ' + vt(s.target) + (T(s.tol) ? ' ± ' + T(s.tol) : '') + U;
}

/* ---------- 範本庫查詢 ---------- */
function find(type, id) {
  var i, j, k, c, s;
  for (i = 0; i < S.lib.length; i++) {
    c = S.lib[i];
    if (type === 'cat' && c.id === id) { return { cat: c }; }
    for (j = 0; j < c.systems.length; j++) {
      s = c.systems[j];
      if (type === 'sys' && s.id === id) { return { cat: c, sys: s }; }
      for (k = 0; k < s.items.length; k++) {
        if (type === 'item' && s.items[k].id === id) { return { cat: c, sys: s, item: s.items[k] }; }
      }
    }
  }
  return null;
}
function childCount(type, id) {
  var f = find(type, id);
  if (!f) { return 0; }
  if (type === 'cat') { return f.cat.systems.length; }
  if (type === 'sys') { return f.sys.items.length; }
  return 0;
}
function siblings(kind, parentId) {
  if (kind === 'cat') { return S.lib; }
  if (kind === 'sys') { return find('cat', parentId).cat.systems; }
  return find('sys', parentId).sys.items;
}
function nodeOf(type, id) { var f = find(type, id); return f ? (f[type]) : null; }
function pointCountOf(item) { return item.points.length; }

/* ---------- 驗證 ---------- */
function parseNum(s) {
  var t = T(s);
  if (t === '') { return null; }
  var n = Number(t);
  return isFinite(n) ? n : NaN;
}
function numberErr(v, label) {
  var n = parseNum(v);
  if (n === null) { return '請填寫' + label; }
  if (isNaN(n)) { return label + '要是數字（例如 1.5）'; }
  return '';
}
function itemSiblings() {
  if (!S.draft) { return []; }
  if (S.mode === 'create') { return find('sys', S.create.parentId).sys.items; }
  var f = find('item', S.sel.id);
  return f.sys.items.filter(function (i) { return i.id !== f.item.id; });
}
function validate(D) {
  var errs = [];
  function add(path, msg) { errs.push({ path: path, msg: msg }); }
  if (!T(D.name)) { add('name', '請填寫名稱'); }
  else if (itemSiblings().some(function (i) { return norm(i.name) === norm(D.name); })) {
    add('name', '此系統已有同名查核項目，請換個名稱');
  }
  D.points.forEach(function (p) {
    var k = p.key, m;
    if (!T(p.title)) { add(k + ':title', '請填寫項次標題'); }
    p.fields.forEach(function (f) {
      if (!T(f.name)) { add(k + ':' + f.key + ':name', '請填寫欄位名稱'); }
      if (f.type === 'number' && !T(f.unit)) { add(k + ':' + f.key + ':unit', '請填寫單位'); }
    });
    var s = p.std;
    if (s.kind === 'text' && !T(s.text)) { add(k + ':stdtext', '請填寫標準文字'); }
    if (s.kind === 'numeric') {
      if (!boundField(p) || boundField(p).type !== 'number') { add(k + ':bind', '請選擇要用來判定的數字欄位'); }
      if (s.op === 'range' && s.form === 'interval') {
        m = numberErr(s.lo, '下限'); if (m) { add(k + ':lo', m); }
        m = numberErr(s.hi, '上限'); if (m) { add(k + ':hi', m); }
        var lo = parseNum(s.lo), hi = parseNum(s.hi);
        if (lo !== null && hi !== null && !isNaN(lo) && !isNaN(hi) && lo > hi) { add(k + ':range', '下限不能大於上限'); }
      } else {
        m = numberErr(s.target, '標準值'); if (m) { add(k + ':target', m); }
        if (s.op === 'range' || (s.op === 'eq' && T(s.tol) !== '')) {
          var tn = parseNum(s.tol);
          if (tn === null) { add(k + ':tol', '請填寫容許誤差'); }
          else if (isNaN(tn)) { add(k + ':tol', '容許誤差要是數字（例如 0.5）'); }
          else if (tn < 0) { add(k + ':tol', '容許誤差不能小於 0'); }
        }
      }
    }
    var ph = T(p.photos);
    if (ph === '') { add(k + ':photos', '請填寫照片張數，至少 1 張'); }
    else if (!/^\d+$/.test(ph)) { add(k + ':photos', '請填寫整數，至少 1 張'); }
    else if (parseInt(ph, 10) < 1) { add(k + ':photos', '照片至少 1 張'); }
  });
  if (!D.points.length) { add('points', '請至少新增一個查核項次'); }
  return errs;
}
function errInputs(path) {
  var parts = path.split(':');
  if (parts[1] === 'range') {
    return [el(iid(parts[0] + ':lo')), el(iid(parts[0] + ':hi'))].filter(Boolean);
  }
  var e = el(iid(path));
  return e ? [e] : [];
}
function focusPathOf(path) {
  var parts = path.split(':');
  return parts[1] === 'range' ? iid(parts[0] + ':lo') : iid(path);
}
function applyErrors() {
  if (!S.draft) { return; }
  var list = S.attempted ? validate(S.draft) : [];
  var map = {};
  list.forEach(function (e) { if (!map[e.path]) { map[e.path] = e.msg; } });
  app.querySelectorAll('[data-err]').forEach(function (sl) {
    var msg = map[sl.dataset.err] || '';
    sl.textContent = msg;
    sl.hidden = !msg;
    errInputs(sl.dataset.err).forEach(function (inp) {
      if (msg) { inp.setAttribute('aria-invalid', 'true'); inp.setAttribute('aria-describedby', sl.id); }
      else { inp.removeAttribute('aria-invalid'); inp.removeAttribute('aria-describedby'); }
    });
  });
  S.draft.points.forEach(function (p) {
    var n = list.filter(function (e) { return e.path.indexOf(p.key + ':') === 0; }).length;
    var b = app.querySelector('[data-badge="' + p.key + '"]');
    if (b) { b.textContent = '待修正 ' + n; b.hidden = n === 0; }
  });
  var sum = el('err-sum');
  if (sum) {
    sum.textContent = list.length ? '尚有 ' + list.length + ' 處要修正' : '';
    sum.hidden = !list.length;
    var more = el('err-sum-more');
    if (more) { more.hidden = !list.length; }
  }
}

/* ---------- 綁定邏輯 ---------- */
function numFields(p) { return p.fields.filter(function (f) { return f.type === 'number'; }); }
function reconcile(p) {
  if (p.std.kind !== 'numeric') { return; }
  var nums = numFields(p);
  if (!nums.some(function (f) { return f.key === p.std.fieldKey; })) { p.std.fieldKey = ''; }
  if (!p.std.fieldKey && nums.length === 1) { p.std.fieldKey = nums[0].key; }
}
function hasContentField(f) { return T(f.name) !== '' || T(f.unit) !== ''; }
function hasContentPoint(p) {
  return T(p.title) !== '' || T(p.desc) !== '' || p.fields.length > 0 || p.std.kind !== 'none' || T(p.photos) !== '1';
}
/* 回傳擋下的原因；null 表示可以動 */
function fieldGuard(p, f) {
  if (p.std.kind !== 'numeric' || f.type !== 'number') { return null; }
  if (f.key === p.std.fieldKey) { return '這個欄位用於數值標準；請先改綁或移除標準。'; }
  if (numFields(p).length === 1) { return '數值標準需要至少一個數字欄位；請先把判定標準改成「無」或「文字」。'; }
  return null;
}

  if (act === 'open-detail') { S.pane = 'detail'; render({ focus: 'detail-h' }); return; }
  if (act === 'a-open-detail') { if (S.tab === 'save') { S.savePane = 'detail'; render({ focus: 'detail-h' }); } else { S.aPane = 'detail'; render({ focus: S.aSel ? 'detail-h' : 'proj-h' }); } return; }
  if (act === 'back') { S.pane = 'list'; render({ focus: S.sel ? 'row-mgr-' + S.sel.id : 'btn-new-cat' }); return; }
  if (act === 'a-back') { S.aPane = 'list'; render({ focus: S.aSel ? 'row-apply-' + S.aSel.id : null }); return; }
  if (act === 'new-cat') { startNameForm('create', 'cat', null); return; }
  if (act === 'new-sys') { startNameForm('create', 'sys', t.dataset.id); return; }
  if (act === 'new-item') { startNewItem(t.dataset.id); return; }
  if (act === 'rename') { startNameForm('rename'); return; }
  if (act === 'cancel-name') { cancelName(); return; }
  if (act === 'ask-delete') { askDelete(); return; }
  if (act === 'do-delete') { doDelete(); return; }
  if (act === 'cancel-delete') { S.mode = 'view'; render({ focus: 'btn-delete' }); return; }
  if (act === 'edit-item') { startEdit(); return; }
  if (act === 'cancel-edit') { cancelEdit(); return; }
  if (act === 'a-apply') { doApply(false); return; }
  if (act === 'a-yes') { doApply(true); return; }
  if (act === 'a-no') { S.aConfirm = false; render({ focus: 'btn-a-apply' }); return; }
  if (act === 'a-reselect') {
    S.aNotice = null; S.aSel = null; S.aTarget = ''; S.aPane = 'list';
    render({ focus: S.lib.length ? 'row-apply-' + S.lib[0].id : null });
    return;
  }
  if (act === 'a-toproj') { S.aNotice = null; S.aPane = 'detail'; render({ focus: 'proj-h', scrollTo: 'proj-panel' }); return; }
  if (S.draft) { onEditorAct(act, t); }
});
app.addEventListener('input', function (e) { onInput(e.target); });
app.addEventListener('change', function (e) { onChange(e.target); });
app.addEventListener('submit', function (e) {
  e.preventDefault();
  var form = e.target.getAttribute('data-form');
  if (form === 'name') { saveName(); }
  else if (form === 'item') { saveItem(); }
});
app.addEventListener('toggle', function (e) {
  if (e.target.id === 'preview') { S.previewOpen = e.target.open; }
}, true);
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target.matches && e.target.matches('#item-form input[type="text"]')) { e.preventDefault(); return; }
  if (e.key !== 'Escape') { return; }
  if (S.guard) { S.guard = null; render({ focus: 'in-name' }); return; }
  if (S.confirmRemove) { S.confirmRemove = null; render(); return; }
  if (S.tab === 'mgr') {
    if (S.mode === 'confirmDelete') { S.mode = 'view'; render({ focus: 'btn-delete' }); return; }
    if (S.mode === 'rename' || (S.mode === 'create' && S.create && S.create.kind !== 'item')) { cancelName(); return; }
  } else if (S.aConfirm) { S.aConfirm = false; render({ focus: 'btn-a-apply' }); }
});
/* ---------- 啟動 ---------- */
render();
})();
</script>
