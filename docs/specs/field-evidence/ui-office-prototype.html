      :root,

        --color-status-warning-bg: #fff3cf;
        --color-status-warning-border: #765000;
        --color-status-danger: #a12b25;
        --color-status-danger-bg: #fff0ed;
        --color-status-danger-border: #a12b25;
        --color-status-info: #00577d;
        --color-status-info-bg: #e5f4fb;
        --color-status-info-border: #00577d;
        --color-status-neutral: #46566b;
        --color-status-neutral-bg: #edf1f5;
        --color-status-neutral-border: #46566b;

        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 20px;
        --space-6: 24px;
        --space-8: 32px;
        --space-10: 40px;
        --space-12: 48px;

        --radius-sm: 4px;
        --radius-md: 8px;
        --radius-lg: 12px;
        --radius-xl: 16px;
        --shadow-header: 0 1px 0 rgb(16 24 40 / 6%);

          0 2px 6px rgb(20 38 66 / 5%), 0 12px 28px rgb(20 38 66 / 4%);
        --shadow-focus: 0 0 0 3px
          color-mix(in srgb, var(--color-focus) 24%, transparent);

        --font-family-sans:

        --color-text-on-primary: #0b1422;
        --color-action-danger-hover: #ffb9b2;
        --color-text-on-danger: #24100e;
        --color-status-success: #8de1aa;
        --color-status-success-bg: #153b2a;
        --color-status-success-border: #8de1aa;
        --color-status-warning: #ffda82;
        --color-status-warning-bg: #45371a;
        --color-status-warning-border: #ffda82;
        --color-status-danger: #ffaaa0;
        --color-status-danger-bg: #482722;
        --color-status-danger-border: #ffaaa0;
        --color-status-info: #9cddf3;
        --color-status-info-bg: #15384b;
        --color-status-info-border: #9cddf3;
        --color-status-neutral: #c2cfdd;
        --color-status-neutral-bg: #283a4e;
        --color-status-neutral-border: #c2cfdd;
        --shadow-header: 0 1px 0 rgb(255 255 255 / 7%);
        --shadow-panel: 0 8px 28px rgb(0 0 0 / 18%);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]),
        :root[data-theme="system"] {
          color-scheme: dark;

          --color-text-on-danger: #24100e;
          --color-status-success: #8de1aa;
          --color-status-success-bg: #153b2a;
          --color-status-success-border: #8de1aa;
          --color-status-warning: #ffda82;
          --color-status-warning-bg: #45371a;
          --color-status-warning-border: #ffda82;
          --color-status-danger: #ffaaa0;

          --color-status-info-border: #9cddf3;
          --color-status-neutral: #c2cfdd;

          --color-status-neutral-border: #c2cfdd;
          --shadow-header: 0 1px 0 rgb(255 255 255 / 7%);
          --shadow-panel: 0 8px 28px rgb(0 0 0 / 18%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        :root:not([data-theme]),
        :root[data-theme="system"],
        :root[data-theme="light"],
        :root[data-theme="dark"] {
          --motion-fast: 0ms;
          --motion-medium: 0ms;
        }
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding-top: 40px;
        background: var(--color-bg-page);
        color: var(--color-text-primary);
        font: 15px/1.58 var(--font-family-sans);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        min-width: 44px;
        padding: 8px 16px;
        border: 1px solid var(--color-border-control);
        border-radius: 4px;
        background: var(--color-bg-surface);
        color: var(--color-text-primary);
        cursor: pointer;
        text-decoration: none;
        font-weight: 500;
      }
      button:hover,
      .button:hover {
        background: var(--color-bg-muted);
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .primary {
        min-height: 48px;
        padding: 8px 24px;
        font-weight: 700;
        border: 2px solid var(--color-action-primary);
        background: var(--color-action-primary);
        color: var(--color-text-on-primary);
        min-width: 128px;
      }
      .primary:hover {
        background: var(--color-action-primary-hover);
      }
      .danger {
        border: 2px solid var(--color-status-danger);
        color: var(--color-status-danger);
      }
      .danger-fill {
        background: var(--color-status-danger);
        color: var(--color-text-on-danger);
      }
      .danger-fill:hover {
        background: var(--color-action-danger-hover);
      }
      :focus-visible {
        outline: 3px solid var(--color-focus);
        outline-offset: 3px;
      }
      header {
        background: var(--color-brand-primary);
        color: white;
        border-bottom: 3px solid var(--color-brand-accent);
      }
      .header-inner {
        max-width: 1152px;
        margin: auto;
        padding: 16px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
      }
      .brand {
        font-size: 19px;
        font-weight: 700;
      }
      .account {
        position: relative;
        margin-inline-start: auto;
      }
      #person-trigger {
        color: white;
        background: transparent;
        border-color: var(--color-brand-accent);
        font-weight: 650;
      }
      #person-trigger:hover {
        background: var(--color-header-nav-hover);
      }
      #person-trigger:focus-visible {
        outline-color: var(--color-brand-accent);
      }
      .person-menu {
        position: absolute;
        right: 0;
        top: calc(100% + 4px);
        z-index: 20;
        width: 200px;
        padding: 8px;
        color: var(--color-text-primary);
        background: var(--color-bg-raised);
        border: 1px solid var(--color-border);
        border-radius: 4px;
        box-shadow: var(--shadow-panel);
      }
      .person-menu button {
        display: flex;
        width: 100%;
        justify-content: start;
        border: 0;
        color: var(--color-text-primary);
        background: var(--color-bg-raised);
      }
      .person-menu button:hover {
        background: var(--color-bg-muted);
      }
      .person-menu p {
        margin: 8px;
        font-size: 13px;
      }
      .header-nav {
        display: flex;
        gap: 24px;
        max-width: 1152px;
        padding: 0 24px;
        margin: auto;
      }
      .header-nav button {
        padding: 8px 12px;
        border: 0;
        border-radius: 0;
        border-bottom: 3px solid transparent;
        color: white;
        background: transparent;
      }
      .header-nav button[aria-current="page"] {
        border-bottom-color: var(--color-brand-accent);
        background: var(--color-header-nav-current);
        color: var(--color-brand-accent);
      }
      .header-nav button:hover {
        background: var(--color-header-nav-hover);
      }
      .header-nav button:focus-visible {
        outline-color: var(--color-brand-accent);
        outline-offset: -3px;
      }
      main {
        max-width: 1152px;
        margin: auto;
        padding: 24px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .prototype-toolbar {
        position: fixed;
        inset: 0 0 auto;
        height: 40px;
        z-index: 50;
        background: var(--color-bg-muted);
        border-bottom: 1px solid var(--color-border);
      }
      .prototype-tools {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 16px;
        height: 100%;
        max-width: 1152px;
        margin: auto;
      }
      .prototype-tag {
        font-size: 12px;
        white-space: nowrap;
        border: 1px solid var(--color-border-control);
        padding: 0 4px;
        border-radius: 4px;
      }
      .prototype-toolbar button,
      .prototype-toolbar select {
        height: 32px;
        min-height: 32px;
        padding: 2px 8px;
        font-size: 13px;
        white-space: nowrap;
      }
      .prototype-toolbar select {
        width: 80px;
        padding: 2px 4px;
      }
      .prototype-toolbar :focus-visible {
        outline-offset: -2px;
      }
      .prototype-help {
        position: fixed;
        top: 40px;
        left: max(8px, calc((100vw - 1120px) / 2));
        z-index: 45;
        width: min(560px, calc(100vw - 16px));
        padding: 16px;
        max-height: calc(100dvh - 56px);
        overflow: auto;
        border: 1px solid var(--color-border-control);
        border-radius: 4px;
        box-shadow: var(--shadow-panel);
        background: var(--color-bg-raised);
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
      :where(h1, h2, h3, section, button, input, select, textarea) {
        scroll-margin-block-start: 48px;
      }
      .hero,
      .panel,
      .photo-card {
        background: var(--color-bg-surface);
        border: 1px solid var(--color-border);
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 16px;
      }
      .hero {
        border-inline-start: 4px solid var(--color-status-info);
      }
      h1 {
        font-size: 24px;
        line-height: 1.3;
        margin: 4px 0 12px;
      }
      h2 {
        font-size: 20px;
        margin: 0 0 12px;
      }
      h3 {
        font-size: 17px;
        margin: 0 0 8px;
      }
      p {
        margin: 8px 0 16px;
        overflow-wrap: anywhere;
      }
      small,
      .muted {
        color: var(--color-text-secondary);
      }
      .badge {
        display: inline-block;
        padding: 2px 10px;
        border: 1px solid var(--color-status-info-border);
        border-radius: 4px;
        color: var(--color-status-info);
        background: var(--color-status-info-bg);
        font-size: 14px;
      }
      .success {
        color: var(--color-status-success);
        background: var(--color-status-success-bg);
        border-color: var(--color-status-success-border);
      }
      .warning {
        color: var(--color-status-warning);
        background: var(--color-status-warning-bg);
        border-color: var(--color-status-warning-border);
      }
      .notice,
      .confirm {
        border: 1px solid var(--color-status-warning);
        border-inline-start-width: 4px;
        padding: 16px;
        border-radius: 4px;
        background: var(--color-status-warning-bg);
        color: var(--color-text-primary);
        margin: 12px 0;
      }
      .notice p,
      .confirm p {
        margin: 4px 0 12px;
      }
      .feedback {
        padding: 12px;
        border: 1px solid var(--color-status-success-border);
        background: var(--color-status-success-bg);
        margin: 12px 0;
      }
      .error {
        color: var(--color-status-danger);
        font-weight: 600;
      }
      .point {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 0;
        border-top: 1px solid var(--color-border);
        align-items: center;
      }
      .point p {
        margin: 4px 0;
      }
      .step-list {
        display: flex;
        gap: 20px;
        padding: 0 0 16px;
        list-style: none;
        border-bottom: 1px solid var(--color-border);
      }
      .step-list .current {
        font-weight: 700;
        border-bottom: 3px solid var(--color-selection);
      }
      .preview {
        background: var(--color-bg-muted);
        padding: 16px;
        border: 1px solid var(--color-border);
        border-radius: 4px;
        overflow: hidden;
        text-align: center;
        touch-action: pan-y;
      }
      canvas {
        max-width: 100%;
        height: auto;
        vertical-align: middle;
      }
      .preview canvas {
        max-height: 440px;
        width: auto;
      }
      .crop-map {
        display: block;
        width: auto;
        max-width: 100%;
        max-height: 160px;
        cursor: move;
        touch-action: none;
      }
      .editor-grid {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 24px;
        align-items: start;
      }
      .controls {
        display: grid;
        gap: 12px;
      }
      .controls label {
        display: grid;
        gap: 4px;
      }
      input:not([type="checkbox"]),
      select,
      textarea {
        width: 100%;
        min-height: 44px;
        background: var(--color-bg-surface);
        color: var(--color-text-primary);
        border: 1px solid var(--color-border-control);
        border-radius: 4px;
        padding: 8px 12px;
      }
      input[type="range"] {
        padding: 0;
        accent-color: var(--color-selection);
      }
      input[type="checkbox"] {
        width: 22px;
        height: 22px;
        accent-color: var(--color-selection);
        flex-shrink: 0;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 48px;
        padding: 8px;
      }
      fieldset {
        border: 1px solid var(--color-border-control);
        border-radius: 4px;
        margin: 16px 0;
        padding: 12px;
      }
      legend {
        padding: 0 8px;
        font-weight: 600;
      }
      textarea {
        min-height: 88px;
        resize: vertical;
      }
      .photo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr));
        gap: 16px;
      }
      .photo-card {
        padding: 16px;
        margin: 0;
      }
      .photo-card canvas {
        display: block;
        width: 100%;
        max-height: 220px;
        object-fit: contain;
        background: var(--color-bg-muted);
        margin-bottom: 12px;
      }
      .photo-card p {
        margin: 8px 0;
      }
      .compare {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-block: 16px;
        align-items: start;
      }
      figure {
        margin: 0;
        min-width: 0;
      }
      figure canvas {
        width: 100%;
        display: block;
      }
      .image-open {
        display: block;
        padding: 0;
        border: 0;
        width: 100%;
        background: transparent;
        cursor: zoom-in;
      }
      .image-open:hover {
        background: transparent;
      }
      #label-viewer {
        width: min(1000px, calc(100vw - 24px));
        max-width: calc(100vw - 24px);
        max-height: calc(100dvh - 24px);
        padding: 16px;
        border: 1px solid var(--color-border-control);
        border-radius: 8px;
        background: var(--color-bg-surface);
        color: var(--color-text-primary);
      }
      #label-viewer::backdrop {
        background: rgb(0 0 0 / 65%);

        bottom: 0;

      .handle-s {

        bottom: 0;
        transform: translate(-50%, 50%);
      }
      .handle-sw {
        left: 0;
        bottom: 0;
        transform: translate(-50%, 50%);
      }
      .handle-w {
        left: 0;
        top: 50%;

      // 拉直採覆蓋原工作框的縮放，避免空角；輸出像素數不增加。
      function preparedSource(source, edit) {
        const canvas = document.createElement("canvas");
        const swap = edit.rotation % 180 !== 0;
        canvas.width = swap ? source.height : source.width;
        canvas.height = swap ? source.width : source.height;
        const ctx = canvas.getContext("2d");
        const angle = ((edit.straighten || 0) * Math.PI) / 180;
        const c = Math.abs(Math.cos(angle)),
          s = Math.abs(Math.sin(angle));
        const scale = Math.max(
          c + (canvas.height / canvas.width) * s,
          c + (canvas.width / canvas.height) * s,
        );
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate(angle);
        ctx.scale(scale, scale);
        ctx.rotate((edit.rotation * Math.PI) / 180);
        ctx.drawImage(source, -source.width / 2, -source.height / 2);
        return canvas;

      function editedCanvas(source, edit) {
        const rotated = preparedSource(source, edit);
        const crop = edit.crop || { x: 0, y: 0, width: 1, height: 1 };
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(64, Math.round(rotated.width * crop.width));
        canvas.height = Math.max(64, Math.round(rotated.height * crop.height));
        const ctx = canvas.getContext("2d");
        ctx.filter = `brightness(${1 + edit.brightness / 100})`;
        ctx.drawImage(
          rotated,
          crop.x * rotated.width,
          crop.y * rotated.height,
          crop.width * rotated.width,
          crop.height * rotated.height,
          0,

          canvas.width,
          canvas.height,

      function glyphText(text) {

            line = "";

      function layerLayout(image, layer, photo, preUpload = false) {
        const short = Math.min(image.width, image.height);
        const margin = Math.max(2, Math.round(short * 0.02));

        const multiplier = { small: 0.9, medium: 1, large: 1.2 }[layer.size];
        const width = Math.min(
          image.width - 2 * margin,
          Math.round(short * ratio),

        const size = Math.max(14, Math.round(short * 0.022 * multiplier));
        const pad = Math.max(2, Math.round(short * 0.006));

          lineHeight = size * 1.2;

        const values = layerValues(photo, layer, preUpload);
        const rows = labels.map((label, i) => {
          const a = wrapTwo(ctx, label, left - 2 * pad);
          const b = wrapTwo(
            ctx,
            values[i] || (i === 2 ? "未填寫" : "未記錄"),
            width - left - 2 * pad,

          return {
            a,

          (right ? image.width - margin - width : margin) +
            layer.offset_x * image.width,
          margin,
          image.width - margin - width,
        );
        const y = clamp(
          (bottom ? image.height - margin - height : margin) +
            layer.offset_y * image.height,
          margin,
          image.height - margin - height,
        );

          y,

          height,

          lineHeight,

        if (!box.fits) return canvas;

            [row.b, box.x + box.left + box.pad],

    </figure><figure data-version="office"><figcaption>內業版</figcaption>
    <button class="image-open" type="button" data-action="zoom-label"
      ${!p.layer.enabled ? "disabled" : ""}
      aria-label="放大檢視內業版照片的標示">
    <canvas id="office-view" role="img" aria-label="含五欄工程標示的內業版">
    </canvas></button>
    <div class="actions">${
      p.layer.enabled
        ? button("放大檢視標示", "zoom-label")
        : "<p>圖層已關閉。</p>"
    }</div>
    </figure></div>
    <p class="muted">工程標示以圖層疊在照片內，比例與字型原型給負責人看後可調。
    現場版保持乾淨；內業版依目前圖層設定合成。</p>
    <div class="actions">${
      p.status === "active"
        ? button("編修內業版", "office-edit", "primary")
        : "<p>歷史照片僅供檢視，不能編修或刪除。</p>"
    }
    ${button("下載原尺寸", "download")}</div>
    ${auditMarkup(p)}</section>`;
        paint($("#field-view"), fieldCanvas(p));
        paint($("#office-view"), officeCanvas(p));
        setVersion(mobileVersion);
        bind();
        focusHeading();
      }
      // 放大只擷取既有圖層位置的影像像素，不重排文字。
      function openLabelViewer() {
        if (!selected.layer.enabled) return;
        const full = officeCanvas(selected);
        const body = editedCanvas(fieldCanvas(selected), selected.office);
        const box = layerLayout(body, selected.layer, selected);
        const canvas = $("#label-zoom-canvas");
        canvas.width = box.width;
        canvas.height = box.height;
        canvas
          .getContext("2d")
          .drawImage(
            full,
            box.x,
            box.y,
            box.width,
            box.height,
            0,
            0,
            box.width,
            box.height,
          );
        canvas.setAttribute(
          "aria-label",
          labels
            .map(
              (label, i) =>
                label + "：" + layerValues(selected, selected.layer)[i],
            )
            .join("；"),
        );
        $("#label-zoom").value = Math.max(
          100,
          Math.ceil((18 / box.size) * 4) * 25,
        );
        zoomLabel();
        $("#label-viewer").showModal();
        $("#label-close").focus({ preventScroll: true });
        $("#label-viewport").scrollTo(0, 0);
      }
      function describeLayer(layer, photo) {
        return {
          顯示: layer.enabled ? "開啟" : "關閉",
          角落: {
            bottom_left: "左下",
            bottom_right: "右下",
            top_left: "左上",
            top_right: "右上",
          }[layer.corner],
          偏移:
            "水平 " +
            Math.round(layer.offset_x * 100) +
            "%／垂直 " +
            Math.round(layer.offset_y * 100) +
            "%",
          大小: { small: "小", medium: "中", large: "大" }[layer.size],
          樣式: {
            dark: "半透明深底白字",
            outline: "透明底白字加描邊",
            paper: "白底黑字",
          }[layer.style],
          ...Object.fromEntries(
            labels.map((name, i) => [name, layerValues(photo, layer)[i]]),
          ),
        };
      }
      function auditMarkup(photo) {
        if (!photo.audit?.length) return "";
        return (
          `<section class="audit-history"><h2>圖層稽核紀錄示意</h2>` +
          photo.audit
            .map(
              (entry) =>
                `<article><h3>已修改圖層資訊</h3>
      <p>${entry.actor} · ${entry.time}</p><ul>` +
                Object.keys(entry.after)
                  .filter((key) => entry.before[key] !== entry.after[key])
                  .map(
                    (key) => `<li><strong>${key}</strong><p>修改前：
        ${escapeHtml(entry.before[key])}<br>修改後：
        ${escapeHtml(entry.after[key])}</p></li>`,
                  )
                  .join("") +
                "</ul></article>",
            )
            .join("") +
          "</section>"
        );
      }
      function zoomLabel() {
        const zoom = Number($("#label-zoom").value);
        const canvas = $("#label-zoom-canvas");
        canvas.style.width = (canvas.width * zoom) / 100 + "px";
        $("#label-zoom-value").textContent = zoom + "%";
      }
      function setVersion(value) {
        mobileVersion = value;
        document.querySelectorAll("[data-version]").forEach((el) => {
          el.hidden = innerWidth <= 640 && el.dataset.version !== value;
        });
        document
          .querySelectorAll('[data-action^="version:"]')
          .forEach((el) => {
            el.setAttribute(
              "aria-pressed",
              String(el.dataset.action === "version:" + value),
            );
          });
      }
      window.addEventListener("resize", () => setVersion(mobileVersion));
      function navigateOther() {
        const go = () => {
          const file =
            mode === "field"
              ? "ui-office-prototype.html"
              : "ui-field-prototype.html";
          location.href =
            file + "#" + encodeURIComponent(JSON.stringify(state));
        };
        if (dirty || draft || upload) {
          const host = $("#navigation-confirm");
          confirmAt(
            host,
            "放棄未完成操作並切換",
            "未確認的編修或待上傳照片會遺失；已上傳資料會沿用。",
            () => {
              upload = null;
              dirty = false;
              draft = null;
              go();
            },
            true,
          );
        } else go();
      }
      function bind() {
        document.querySelectorAll("[data-action]").forEach((el) => {
          if (["do-confirm", "cancel-confirm"].includes(el.dataset.action))
            return;
          el.onclick = () => act(el.dataset.action);
        });
        if ($("#filter")) {
          $("#filter").value = filter;
          $("#filter").onchange = (e) => {
            filter = e.target.value;
            home();
            $("#filter").focus({ preventScroll: true });
          };
        }
      }
      function act(action) {
        const [name, value] = action.split(":");
        if (name === "capture") return capture(value);
        if (name === "choose") {
          draft.shape = value;
          editing = cleanEdit();
          dirty = true;
          return fieldEditor();
        }
        if (name === "home") {
          home();
          focusHeading();
          return;
        }
        if (name === "next") return targetForm();
        if (name === "field-rotate") {
          editing.rotation = (editing.rotation + 90) % 360;
          dirty = true;
          paintField();
          return;
        }
        if (name === "rotate")
          return changeEdit(() => {
            editing.rotation = (editing.rotation + 90) % 360;
            editing.crop = null;
            editing.ratio = "original";
          });
        if (name === "reset-edit")
          return changeEdit(() => {
            const layer = editing.layer;
            editing = cleanEdit();
            editing.layer = layer;
          });
        if (name === "undo") {
          if (undoStack.length) {
            editing = undoStack.pop();
            dirty = true;
            paintEditor();
          }
          return;
        }
        if (name === "crop-smaller") return changeEdit(() => sizeCrop(-0.08));
        if (name === "crop-larger") return changeEdit(() => sizeCrop(0.08));
        if (name === "zoom-in" || name === "zoom-out")
          return changeEdit(() => {
            editing.zoom = Math.max(
              1,
              Math.min(3, editing.zoom + (name === "zoom-in" ? 0.2 : -0.2)),
            );
          });
        if (name === "pan")
          return changeEdit(() => {
            const key = ["left", "right"].includes(value) ? "x" : "y";
            editing[key] += ["left", "up"].includes(value) ? -20 : 20;
          });
        if (name === "layer-pan") return changeEdit(() => nudgeLayer(value));
        if (name === "restore-source")
          return changeEdit(() => {
            editing.layer.overrides = {};
          });
        if (name === "leave-editor" || name === "leave-office") {
          return confirmAt(
            $("#leave-confirm"),
            "放棄未儲存變更",
            "尚未確認的編修與輸入不會保存，已上傳照片不受影響。",
            () => {
              if (name === "leave-office") officeDetail(selected.id);
              else home();
            },
            true,
          );
        }
        if (name === "retry") {
          upload.scenario = "success";
          upload.status = "uploading";
          queue();
          return tryUpload(upload.token);
        }
        if (name === "abandon")
          return confirmAt(
            $("#abandon-confirm"),
            "確認放棄這張照片",
            "這張尚未上傳的照片將從此頁移除，需要時請重新拍攝。",
            () => {
              upload = null;
              message = "已放棄待上傳照片。";
              home();
              $("#feedback [role=status]").focus({ preventScroll: true });
            },
            true,
          );
        if (name === "modify") {
          draft = structuredClone(
            state.photos.find((p) => p.id === Number(value)),
          );
          return targetForm(true);
        }
        if (name === "delete")
          return confirmAt(
            $("#confirm-" + value),
            "確認刪除照片",
            "照片將不再計入覆蓋數，從現場清單移除；內業仍可查到已刪除紀錄。",
            () => {
              state.photos.find((p) => p.id === Number(value)).status =
                "deleted";
              message = "照片已刪除，歷史紀錄保留。";
              home();
              $("#feedback [role=status]").focus({ preventScroll: true });
            },
            true,
          );
        if (name === "open") return officeDetail(Number(value));
        if (name === "zoom-label") return openLabelViewer();
        if (name === "version") return setVersion(value);
        if (name === "office-edit") return officeEditor();
        if (name === "apply") {
          const snapshot = copy(editing),
            oldLayer = copy(selected.layer);
          $("#editor-work").inert = true;
          document.querySelectorAll(".editor-bar button").forEach((el) => {
            el.disabled = true;
          });
          const host = $("#apply-confirm");
          confirmAt(
            host,
            "確認套用內業版",
            "會直接更新內業版，不保留舊內業版；現場版不變。" +
              "圖層設定及文字的修改會留下誰、何時、修改前後的紀錄。",
            () => {
              const before = describeLayer(oldLayer, selected);
              selected.office = {
                ...snapshot,
                layer: undefined,
                zoom: 1,
                x: 0,
                y: 0,
              };
              selected.layer = copy(snapshot.layer);
              const after = describeLayer(selected.layer, selected);
              if (
                JSON.stringify(oldLayer) !== JSON.stringify(snapshot.layer)
              ) {
                selected.audit = selected.audit || [];
                selected.audit.push({
                  before_settings: copy(oldLayer),
                  after_settings: copy(snapshot.layer),
                  actor: "林小姐",
                  time: "2026/10/31 10:45（示意）",
                  before,
                  after,
                });
              }
              officeDetail(selected.id);
              const note = document.createElement("p");
              note.className = "feedback";
              note.setAttribute("role", "status");
              note.textContent = "已套用內業版，現場版不變。";
              app.querySelector("section").prepend(note);
              reveal(note);
            },
          );
          const cancel = host.querySelector("[data-action=cancel-confirm]");
          const original = cancel.onclick;
          cancel.onclick = () => {
            $("#editor-work").inert = false;
            document.querySelectorAll(".editor-bar button").forEach((el) => {
              el.disabled = false;
            });
            original();
            paintEditor();
          };
          return;
        }
        if (name === "standard")
          return confirmAt(
            $("#standard-confirm"),
            "確認依新標準重新查核",
            "只將鋼筋工程的有效照片標為標準變更作廢；其他項目不變。",
            () => {
              state.photos
                .filter((p) => p.item === 0 && p.status === "active")
                .forEach((p) => {
                  p.status = "void";
                });
              state.recheck = true;
              message = "鋼筋工程已標待重查；請切換現場補拍。";
              home();
              $("#feedback [role=status]").focus({ preventScroll: true });
            },
          );
        if (name === "download") {
          const a = document.createElement("a");
          a.download = "內業版示意.jpg";
          a.href = officeCanvas(selected).toDataURL("image/jpeg", 0.9);
          a.click();
        }
      }
      $("#switch").onclick = navigateOther;
      $("#label-close").onclick = () => $("#label-viewer").close();
      $("#label-zoom").oninput = zoomLabel;
      document.querySelectorAll("[data-label-pan]").forEach((button) => {
        button.onclick = () => {
          const direction = button.dataset.labelPan;
          $("#label-viewport").scrollBy({
            left:
              direction === "left" ? -160 : direction === "right" ? 160 : 0,
            top: direction === "up" ? -120 : direction === "down" ? 120 : 0,
          });
        };
      });
      function setHelp(open) {
        $("#prototype-help").hidden = !open;
        $("#help-toggle").setAttribute("aria-expanded", String(open));
      }
      $("#help-toggle").onclick = () => setHelp($("#prototype-help").hidden);
      $("#help-close").onclick = () => {
        setHelp(false);
        $("#help-toggle").focus({ preventScroll: true });
      };
      function closePerson() {
        $("#person-menu").hidden = true;
        $("#person-trigger").setAttribute("aria-expanded", "false");
      }
      $("#person-trigger").onclick = () => {
        const open = $("#person-menu").hidden;
        $("#person-menu").hidden = !open;
        $("#person-trigger").setAttribute("aria-expanded", String(open));
        if (open) {
          setHelp(false);
          $("#person-menu button").focus({ preventScroll: true });
        }
      };
      document.querySelectorAll("[data-person]").forEach((button) => {
        button.onclick = () => {
          const note = $("#person-note");
          note.hidden = false;
          note.textContent =
            button.dataset.person === "settings"
              ? "此原型只展示照片流程；外觀可由上方工具列調整。"
              : "此原型沒有連接正式帳號；關閉頁面即可結束試用。";
        };
      });
      document.querySelectorAll("[data-shell]").forEach((button) => {
        button.onclick = () => {
          if (draft || dirty || upload) {
            confirmAt(
              $("#navigation-confirm"),
              "放棄未完成操作並返回",
              "未確認的編修或待上傳照片會遺失；已上傳資料會保留。",
              () => {
                upload = null;
                draft = null;
                dirty = false;
                home();
              },
              true,
            );
            return;
          }
          if (button.dataset.shell === "projects" && mode === "field") {
            setShellCurrent("projects");
            app.innerHTML = `<section class="panel"><h1>我的專案</h1>
        <h2>${project}</h2><p>這是照片原型中的專案入口示意。</p>
        ${buttonHtmlBack()}</section>`;
            bind();
            focusHeading();
          } else home();
        };
      });
      function setShellCurrent(section) {
        document.querySelectorAll("[data-shell]").forEach((button) => {
          if (button.dataset.shell === section)
            button.setAttribute("aria-current", "page");
          else button.removeAttribute("aria-current");
        });
      }
      function buttonHtmlBack() {
        return button("返回照片任務", "home");
      }
      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape" || $("#label-viewer").open) return;
        if (!$("#person-menu").hidden) {
          closePerson();
          $("#person-trigger").focus({ preventScroll: true });
        } else if (!$("#prototype-help").hidden) {
          setHelp(false);
          $("#help-toggle").focus({ preventScroll: true });
        }
      });
      document.addEventListener("click", (event) => {
        if (!event.target.closest(".account")) closePerson();
      });
      $("#theme").onchange = (e) => {
        document.documentElement.dataset.theme = e.target.value;
        state.theme = e.target.value;
      };
      // 原型的選項支援明確方向鍵路徑，滑鼠仍沿用原生選單。
      document.addEventListener("keydown", (event) => {
        const el = event.target;
        if (
          !(el instanceof HTMLSelectElement) ||
          event.altKey ||
          event.ctrlKey ||
          event.metaKey ||
          event.shiftKey
        )
          return;
        if (!["ArrowDown", "ArrowUp", "Home", "End"].includes(event.key))
          return;
        event.preventDefault();
        const last = el.options.length - 1;
        const index =
          event.key === "Home"
            ? 0
            : event.key === "End"
              ? last
              : Math.max(
                  0,
                  Math.min(
                    last,
                    el.selectedIndex + (event.key === "ArrowDown" ? 1 : -1),
                  ),
                );
        el.selectedIndex = index;
        el.dispatchEvent(new Event("input", { bubbles: true }));
        el.dispatchEvent(new Event("change", { bubbles: true }));
      });
      window.addEventListener("beforeunload", (e) => {
        if (dirty || draft || upload) {
          e.preventDefault();
          e.returnValue = "";
        }
      });
      // URL 只攜帶已上傳示意資料與參數，兩份原型可接續狀態。
      // 未確認草稿、待上傳照片、圖片位元組不進 URL 或持久儲存。
      async function boot() {
        $("#theme").value = state.theme || "light";
        document.documentElement.dataset.theme = state.theme || "light";
        const raw = $("#label-font").textContent.replace(/\s/g, "");
        const font = new FontFace(
          "EvidenceLabel",
          "url(data:font/woff2;base64," + raw + ")",
        );
        document.fonts.add(await font.load());
        await loadPictures();
        state.photos.forEach((photo) => {
          photo.layer = photo.layer || layerDefaults();
          photo.field = { ...cleanEdit(), ...photo.field };
          photo.office = { ...cleanEdit(), ...photo.office };
        });
        home();
        document.body.dataset.ready = "true";
      }
      boot().catch(() => {
        app.innerHTML = '<p role="alert">原型初始化失敗，請重新開啟檔案。</p>';
      });

      function fieldMarkup() {
        return `<div class="editor-bar">
    ${button("取消", "leave-editor")}<h1>編修現場照片</h1>
    ${button("確認", "next", "primary")}</div>
    <div id="leave-confirm" class="inline-host"></div>
    <div class="field-editor-body">
      <div class="photo-stage field-photo-stage">
        <canvas id="editor-canvas" role="img" aria-label="現場照片與圖層預覽">
        </canvas></div>
      <div class="actions field-image-actions">
        ${button("旋轉 90°", "field-rotate")}
        <button id="compare-hold" type="button">按住比較編修前</button>
      </div>
      <label for="brightness">亮度
        <output id="brightness-value"></output></label>
      <input id="brightness" type="range" min="-100" max="100" step="1">
      <div class="field-layer-controls">
        <label class="check"><input id="layer-enabled" type="checkbox">
          顯示工程圖層</label>
        <label for="layer-corner">位置</label><select id="layer-corner">
          <option value="bottom_left">左下</option>
          <option value="bottom_right">右下</option>
          <option value="top_left">左上</option>
          <option value="top_right">右上</option></select>
      </div>
      <details class="field-layer-details"><summary>查看圖層完整文字（唯讀）</summary>
        ${labels
          .map(
            (label, i) => `<label for="layer-field-${i}">${label}</label>
          <textarea id="layer-field-${i}" rows="2" readonly></textarea>`,
          )
          .join("")}
      </details><p class="muted">現場版保持乾淨；清單與內業版依圖層設定顯示。
        精細裁切與文字更正交由內業處理。</p>
    </div>`;
      }
      function paintField() {
        const photo = editorPhoto();
        const body = editedCanvas(editorSource(), editing);
        const canvas = comparing
          ? beforeEdit
          : composeLayer(body, editing.layer, photo, true);
        paint($("#editor-canvas"), canvas);
        $("#brightness").value = editing.brightness;
        $("#brightness-value").textContent = editing.brightness;
        $("#layer-enabled").checked = editing.layer.enabled;
        $("#layer-corner").value = editing.layer.corner;
        layerValues(photo, editing.layer, true).forEach((text, i) => {
          $("#layer-field-" + i).value = text;
        });
      }
      function bindFieldEditor() {
        $("#brightness").oninput = (e) => {
          editing.brightness = Number(e.target.value);
          dirty = true;
          paintField();
        };
        $("#layer-enabled").onchange = (e) => {
          editing.layer.enabled = e.target.checked;
          dirty = true;
          paintField();
        };
        $("#layer-corner").onchange = (e) => {
          editing.layer.corner = e.target.value;
          dirty = true;
          paintField();
        };
        const show = () => {
          comparing = true;
          paintField();
        };
        const hide = () => {
          comparing = false;
          paintField();
        };
        const button = $("#compare-hold");
        button.onpointerdown = show;
        button.onpointerup = hide;
        button.onpointercancel = hide;
        button.onpointerleave = hide;
        button.onkeydown = (e) => {
          if (e.key === " " || e.key === "Enter") {
            e.preventDefault();
            show();
          }
        };
        button.onkeyup = hide;
        button.onblur = hide;
        let timer;
        const canvas = $("#editor-canvas");
        canvas.onpointerdown = (e) => {
          canvas.setPointerCapture(e.pointerId);
          timer = setTimeout(show, 450);
        };
        const release = () => {
          clearTimeout(timer);
          hide();
        };
        canvas.onpointerup = release;
        canvas.onpointercancel = release;
        paintField();
      }
    </script>
  </body>
</html>
