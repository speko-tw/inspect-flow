      :root,

        --color-status-warning-bg: #fff3cf;
        --color-status-warning-border: #765000;
        --color-status-danger: #a12b25;
        --color-status-danger-bg: #fff0ed;
        --color-status-danger-border: #a12b25;
        --color-status-info: #00577d;
        --color-status-info-bg: #e5f4fb;
        --color-status-info-border: #00577d;
        --color-status-neutral: #46566b;
        --color-status-neutral-bg: #edf1f5;
        --color-status-neutral-border: #46566b;

        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 20px;
        --space-6: 24px;
        --space-8: 32px;
        --space-10: 40px;
        --space-12: 48px;

        --radius-sm: 4px;
        --radius-md: 8px;
        --radius-lg: 12px;
        --radius-xl: 16px;
        --shadow-header: 0 1px 0 rgb(16 24 40 / 6%);

          0 2px 6px rgb(20 38 66 / 5%), 0 12px 28px rgb(20 38 66 / 4%);
        --shadow-focus: 0 0 0 3px
          color-mix(in srgb, var(--color-focus) 24%, transparent);

        --font-family-sans:

        --color-text-on-primary: #0b1422;
        --color-action-danger-hover: #ffb9b2;
        --color-text-on-danger: #24100e;
        --color-status-success: #8de1aa;
        --color-status-success-bg: #153b2a;
        --color-status-success-border: #8de1aa;
        --color-status-warning: #ffda82;
        --color-status-warning-bg: #45371a;
        --color-status-warning-border: #ffda82;
        --color-status-danger: #ffaaa0;
        --color-status-danger-bg: #482722;
        --color-status-danger-border: #ffaaa0;
        --color-status-info: #9cddf3;
        --color-status-info-bg: #15384b;
        --color-status-info-border: #9cddf3;
        --color-status-neutral: #c2cfdd;
        --color-status-neutral-bg: #283a4e;
        --color-status-neutral-border: #c2cfdd;
        --shadow-header: 0 1px 0 rgb(255 255 255 / 7%);
        --shadow-panel: 0 8px 28px rgb(0 0 0 / 18%);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]),
        :root[data-theme="system"] {
          color-scheme: dark;

          --color-text-on-danger: #24100e;
          --color-status-success: #8de1aa;
          --color-status-success-bg: #153b2a;
          --color-status-success-border: #8de1aa;
          --color-status-warning: #ffda82;
          --color-status-warning-bg: #45371a;
          --color-status-warning-border: #ffda82;
          --color-status-danger: #ffaaa0;

          --color-status-info-border: #9cddf3;
          --color-status-neutral: #c2cfdd;

          --color-status-neutral-border: #c2cfdd;
          --shadow-header: 0 1px 0 rgb(255 255 255 / 7%);
          --shadow-panel: 0 8px 28px rgb(0 0 0 / 18%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        :root:not([data-theme]),
        :root[data-theme="system"],
        :root[data-theme="light"],
        :root[data-theme="dark"] {
          --motion-fast: 0ms;
          --motion-medium: 0ms;
        }
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding-top: 40px;
        background: var(--color-bg-page);
        color: var(--color-text-primary);
        font: 15px/1.58 var(--font-family-sans);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        min-width: 44px;
        padding: 8px 16px;
        border: 1px solid var(--color-border-control);
        border-radius: 4px;
        background: var(--color-bg-surface);
        color: var(--color-text-primary);
        cursor: pointer;
        text-decoration: none;
        font-weight: 500;
      }
      button:hover,
      .button:hover {
        background: var(--color-bg-muted);
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .primary {
        min-height: 48px;
        padding: 8px 24px;
        font-weight: 700;
        border: 2px solid var(--color-action-primary);
        background: var(--color-action-primary);
        color: var(--color-text-on-primary);
        min-width: 128px;
      }
      .primary:hover {
        background: var(--color-action-primary-hover);
      }
      .danger {
        border: 2px solid var(--color-status-danger);
        color: var(--color-status-danger);
      }
      .danger-fill {
        background: var(--color-status-danger);
        color: var(--color-text-on-danger);
      }
      .danger-fill:hover {
        background: var(--color-action-danger-hover);
      }
      :focus-visible {
        outline: 3px solid var(--color-focus);
        outline-offset: 3px;
      }
      header {
        background: var(--color-brand-primary);
        color: white;
        border-bottom: 3px solid var(--color-brand-accent);
      }
      .header-inner {
        max-width: 1152px;
        margin: auto;
        padding: 16px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
      }
      .brand {
        font-size: 19px;
        font-weight: 700;
      }
      .account {
        position: relative;
        margin-inline-start: auto;
      }
      #person-trigger {
        color: white;
        background: transparent;
        border-color: var(--color-brand-accent);
        font-weight: 650;
      }
      #person-trigger:hover {
        background: var(--color-header-nav-hover);
      }
      #person-trigger:focus-visible {
        outline-color: var(--color-brand-accent);
      }
      .person-menu {
        position: absolute;
        right: 0;
        top: calc(100% + 4px);
        z-index: 20;
        width: 200px;
        padding: 8px;
        color: var(--color-text-primary);
        background: var(--color-bg-raised);
        border: 1px solid var(--color-border);
        border-radius: 4px;
        box-shadow: var(--shadow-panel);
      }
      .person-menu button {
        display: flex;
        width: 100%;
        justify-content: start;
        border: 0;
        color: var(--color-text-primary);
        background: var(--color-bg-raised);
      }
      .person-menu button:hover {
        background: var(--color-bg-muted);
      }
      .person-menu p {
        margin: 8px;
        font-size: 13px;
      }
      .header-nav {
        display: flex;
        gap: 24px;
        max-width: 1152px;
        padding: 0 24px;
        margin: auto;
      }
      .header-nav button {
        padding: 8px 12px;
        border: 0;
        border-radius: 0;
        border-bottom: 3px solid transparent;
        color: white;
        background: transparent;
      }
      .header-nav button[aria-current="page"] {
        border-bottom-color: var(--color-brand-accent);
        background: var(--color-header-nav-current);
        color: var(--color-brand-accent);
      }
      .header-nav button:hover {
        background: var(--color-header-nav-hover);
      }
      .header-nav button:focus-visible {
        outline-color: var(--color-brand-accent);
        outline-offset: -3px;
      }
      main {
        max-width: 1152px;
        margin: auto;
        padding: 24px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .prototype-toolbar {
        position: fixed;
        inset: 0 0 auto;
        height: 40px;
        z-index: 50;
        background: var(--color-bg-muted);
        border-bottom: 1px solid var(--color-border);
      }
      .prototype-tools {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 3px 16px;
        height: 100%;
        max-width: 1152px;
        margin: auto;
      }
      .prototype-tag {
        font-size: 12px;
        white-space: nowrap;
        border: 1px solid var(--color-border-control);
        padding: 0 4px;
        border-radius: 4px;
      }
      .prototype-toolbar button,
      .prototype-toolbar select {
        height: 32px;
        min-height: 32px;
        padding: 2px 8px;
        font-size: 13px;
        white-space: nowrap;
      }
      .prototype-toolbar select {
        width: 80px;
        padding: 2px 4px;
      }
      .prototype-toolbar :focus-visible {
        outline-offset: -2px;
      }
      .prototype-help {
        position: fixed;
        top: 40px;
        left: max(8px, calc((100vw - 1120px) / 2));
        z-index: 45;
        width: min(560px, calc(100vw - 16px));
        padding: 16px;
        max-height: calc(100dvh - 56px);
        overflow: auto;
        border: 1px solid var(--color-border-control);
        border-radius: 4px;
        box-shadow: var(--shadow-panel);
        background: var(--color-bg-raised);
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
      :where(h1, h2, h3, section, button, input, select, textarea) {
        scroll-margin-block-start: 48px;
      }
      .hero,
      .panel,
      .photo-card {
        background: var(--color-bg-surface);
        border: 1px solid var(--color-border);
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 16px;
      }
      .hero {
        border-inline-start: 4px solid var(--color-status-info);
      }
      h1 {
        font-size: 24px;
        line-height: 1.3;
        margin: 4px 0 12px;
      }
      h2 {
        font-size: 20px;
        margin: 0 0 12px;
      }
      h3 {
        font-size: 17px;
        margin: 0 0 8px;
      }
      p {
        margin: 8px 0 16px;
        overflow-wrap: anywhere;
      }
      small,
      .muted {
        color: var(--color-text-secondary);
      }
      .badge {
        display: inline-block;
        padding: 2px 10px;
        border: 1px solid var(--color-status-info-border);
        border-radius: 4px;
        color: var(--color-status-info);
        background: var(--color-status-info-bg);
        font-size: 14px;
      }
      .success {
        color: var(--color-status-success);
        background: var(--color-status-success-bg);
        border-color: var(--color-status-success-border);
      }
      .warning {
        color: var(--color-status-warning);
        background: var(--color-status-warning-bg);
        border-color: var(--color-status-warning-border);
      }
      .notice,
      .confirm {
        border: 1px solid var(--color-status-warning);
        border-inline-start-width: 4px;
        padding: 16px;
        border-radius: 4px;
        background: var(--color-status-warning-bg);
        color: var(--color-text-primary);
        margin: 12px 0;
      }
      .notice p,
      .confirm p {
        margin: 4px 0 12px;
      }
      .feedback {
        padding: 12px;
        border: 1px solid var(--color-status-success-border);
        background: var(--color-status-success-bg);
        margin: 12px 0;
      }
      .error {
        color: var(--color-status-danger);
        font-weight: 600;
      }
      .point {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 0;
        border-top: 1px solid var(--color-border);
        align-items: center;
      }
      .point p {
        margin: 4px 0;
      }
      .step-list {
        display: flex;
        gap: 20px;
        padding: 0 0 16px;
        list-style: none;
        border-bottom: 1px solid var(--color-border);
      }
      .step-list .current {
        font-weight: 700;
        border-bottom: 3px solid var(--color-selection);
      }
      .preview {
        background: var(--color-bg-muted);
        padding: 16px;
        border: 1px solid var(--color-border);
        border-radius: 4px;
        overflow: hidden;
        text-align: center;
        touch-action: pan-y;
      }
      canvas {
        max-width: 100%;
        height: auto;
        vertical-align: middle;
      }
      .preview canvas {
        max-height: 440px;
        width: auto;
      }
      .crop-map {
        display: block;
        width: auto;
        max-width: 100%;
        max-height: 160px;
        cursor: move;
        touch-action: none;
      }
      .editor-grid {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 24px;
        align-items: start;
      }
      .controls {
        display: grid;
        gap: 12px;
      }
      .controls label {
        display: grid;
        gap: 4px;
      }
      input:not([type="checkbox"]),
      select,
      textarea {
        width: 100%;
        min-height: 44px;
        background: var(--color-bg-surface);
        color: var(--color-text-primary);
        border: 1px solid var(--color-border-control);
        border-radius: 4px;
        padding: 8px 12px;
      }
      input[type="range"] {
        padding: 0;
        accent-color: var(--color-selection);
      }
      input[type="checkbox"] {
        width: 22px;
        height: 22px;
        accent-color: var(--color-selection);
        flex-shrink: 0;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 48px;
        padding: 8px;
      }
      fieldset {
        border: 1px solid var(--color-border-control);
        border-radius: 4px;
        margin: 16px 0;
        padding: 12px;
      }
      legend {
        padding: 0 8px;
        font-weight: 600;
      }
      textarea {
        min-height: 88px;
        resize: vertical;
      }
      .photo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr));
        gap: 16px;
      }
      .photo-card {
        padding: 16px;
        margin: 0;
      }
      .photo-card canvas {
        display: block;
        width: 100%;
        max-height: 220px;
        object-fit: contain;
        background: var(--color-bg-muted);
        margin-bottom: 12px;
      }
      .photo-card p {
        margin: 8px 0;
      }
      .compare {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-block: 16px;
        align-items: start;
      }
      figure {
        margin: 0;
        min-width: 0;
      }
      figure canvas {
        width: 100%;
        display: block;
      }
      .image-open {
        display: block;
        padding: 0;
        border: 0;
        width: 100%;
        background: transparent;
        cursor: zoom-in;
      }
      .image-open:hover {
        background: transparent;
      }
      #label-viewer {
        width: min(1000px, calc(100vw - 24px));
        max-width: calc(100vw - 24px);
        max-height: calc(100dvh - 24px);
        padding: 16px;
        border: 1px solid var(--color-border-control);
        border-radius: 8px;
        background: var(--color-bg-surface);
        color: var(--color-text-primary);
      }
      #label-viewer::backdrop {
        background: rgb(0 0 0 / 65%);
      }
      .viewer-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
      }
      .viewer-heading h2 {
        margin: 0;
      }
      #label-viewport {
        width: 100%;
        max-height: 50dvh;
        overflow: auto;
        border: 1px solid var(--color-border-control);
        background: white;
        overscroll-behavior: contain;
      }
      #label-zoom-canvas {
        display: block;
        max-width: none;
        height: auto;
      }
      .viewer-actions {
        margin-top: 12px;
      }
      figcaption {
        padding: 8px 0;
        font-weight: 600;
      }
      .segmented {
        display: flex;
        gap: 4px;
        padding: 4px;
        background: var(--color-bg-muted);
        width: fit-content;
      }
      .segmented button[aria-pressed="true"] {
        border: 2px solid var(--color-selection);
        background: var(--color-selected-bg);
        font-weight: 700;
      }
      .segmented button[aria-pressed="true"]::before {
        content: "✓ ";
      }
      .mobile-versions {
        display: none;
      }
      .section-title {
        margin-top: 24px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--color-border);
      }
      .inline-host {
        scroll-margin-block: 20px;
      }
      .hidden,
      [hidden] {
        display: none !important;
      }
      .back {
        margin-bottom: 16px;
      }
      footer {
        margin-top: 32px;
        color: var(--color-text-secondary);
      }
      @media (max-width: 640px) {
        main {
          padding: 16px;
        }
        .header-inner {
          padding: 12px 16px;
        }
        .header-nav {
          padding: 0 16px;
        }
        .brand {
          font-size: 17px;
        }
        .hero,
        .panel {
          padding: 16px;
        }
        .editor-grid,
        .compare {
          grid-template-columns: 1fr;
          gap: 16px;
        }
        .compare [data-version][hidden] {
          display: none;
        }
        .mobile-versions {
          display: flex;
        }
        .step-list {
          flex-direction: column;
          gap: 4px;
        }
        .point {
          align-items: flex-start;
          flex-direction: column;
        }
        .point button,
        .primary {
          width: 100%;
        }
        .actions {
          align-items: stretch;
        }
        .actions button {
          flex: 1 1 120px;
        }
        .preview {
          padding: 8px;
        }
      }
    </style>
  </head>
  <body data-mode="office">
    <aside class="prototype-toolbar" aria-label="原型工具列">
      <div class="prototype-tools">
        <strong class="prototype-tag">原型</strong>
        <label class="sr-only" for="theme">原型外觀</label>
        <select id="theme">
          <option value="light">淺色</option>
          <option value="dark">深色</option>
          <option value="system">跟隨裝置</option>
        </select>
        <button id="switch" type="button" aria-label="切換到現場原型">
          切至現場
        </button>
        <button
          id="help-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="prototype-help"
        >
          說明
        </button>
      </div>
    </aside>
    <section
      id="prototype-help"
      class="prototype-help"
      hidden
      aria-labelledby="prototype-help-title"
    >
      <h2 id="prototype-help-title">互動原型・待負責人操作核可</h2>
      <p>
        假資料與工地示意圖，未連接正式系統。可離線操作。
        切換兩份原型會沿用已上傳的示意資料；重新開啟不帶網址片段的檔案可重置。
      </p>
      <p>
        姓名選單與主導覽供版面試用，照片流程以外的設定、登出及清單內容
        僅供示意，不會更動正式帳號。核可前不開始 T7、T8。
      </p>
      <button id="help-close" type="button">收合說明</button>
    </section>
    <header>
      <div class="header-inner">
        <div class="brand">InspectFlow 工程查核系統</div>
        <div class="account">
          <button
            id="person-trigger"
            type="button"
            aria-expanded="false"
            aria-controls="person-menu"
            aria-haspopup="true"
          >
            林小姐 ▾
          </button>
          <div
            id="person-menu"
            class="person-menu"
            role="group"
            aria-label="個人選單"
            hidden
          >
            <button type="button" data-person="settings">設定</button>
            <button type="button" data-person="logout">登出</button>
            <p id="person-note" role="status" hidden></p>
          </div>
        </div>
      </div>
      <nav class="header-nav" aria-label="目前工作區">
        <button type="button" data-shell="projects" aria-current="page">
          專案
        </button>
      </nav>
    </header>
    <main>
      <div id="navigation-confirm" class="inline-host"></div>
      <div id="app" aria-busy="false"><p>正在準備示意照片…</p></div>
      <footer>本原型供流程與版面評選；核可前不開始 T7、T8。</footer>
    </main>
    <dialog id="label-viewer" aria-labelledby="label-viewer-title">
      <div class="viewer-heading">
        <h2 id="label-viewer-title">放大檢視標示</h2>

      </div>

      </p>
      <label for="label-zoom"

      ></label>
      <input id="label-zoom" type="range" min="100" max="300" step="25" />

        id="label-viewport"
        tabindex="0"
        role="region"

        aria-describedby="label-help"

        <canvas id="label-zoom-canvas" role="img"></canvas>
      </div>
      <div class="actions viewer-actions">
        <button type="button" data-label-pan="left">向左看</button>
        <button type="button" data-label-pan="right">向右看</button>
        <button type="button" data-label-pan="up">向上看</button>
        <button type="button" data-label-pan="down">向下看</button>
        <button type="button" data-action="download">下載原尺寸</button>
      </div>
    </dialog>

    <script>

      const cleanEdit = () => ({

      const labels = [

        "（含工作平台周邊與外牆轉角施工界面，靠北側臨時通道）";
      const initial = () => ({
        photos: [
          {
            id: 1,

            shape: "wide",

            overview: true,
            points: [],
            status: "active",
            field: cleanEdit(),

            time: "2026/10/31 09:12",
          },
          {
            id: 2,

            shape: "tall",
            caption: "牆柱澆置後表面；注意下方接縫",
            overview: false,
            points: ["c"],

            field: cleanEdit(),

      let state;

      let draft = null,
        editing = null,

      let generation = 0;
      const pictures = {};
      const escapeHtml = (v) =>
        String(v).replace(
          /[&<>"']/g,
          (s) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",

        );
      const button = (label, action, cls = "") =>
        `<button type="button" class="${cls}" data-action="${action}">` +
        `${label}</button>`;
      const badge = (photo) =>
        photo.status === "void"
          ? '<span class="badge warning">標準變更作廢</span>'
          : photo.status === "deleted"
            ? '<span class="badge">已刪除</span>'

      // 內建圖像以向量生成，確保離線可操作且不載入第三方照片。
      async function loadPictures() {
        for (const [key, w, h] of [
          ["wide", 1200, 720],
          ["tall", 540, 810],
        ]) {
          const landmark = key === "wide" ? "A-12" : "C-03";
          const bars = Array.from(
            { length: 14 },
            (_, i) => `<path d="M${i * 100 - 150} 0V${h}"/>`,
          ).join("");
          const cross = Array.from(
            { length: 12 },
            (_, i) => `<path d="M0 ${i * 85}H${w}"/>`,
          ).join("");
          const svg = `<svg xmlns="http://www.w3.org/2000/svg"
      width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
      <rect width="100%" height="100%" fill="#b7c5ca"/>
      <path d="M0 ${h * 0.43}L${w} ${h * 0.19}V${h}H0Z" fill="#ddd6c5"/>
      <path d="M${w * 0.32} 0H${w * 0.61}V${h}H${w * 0.32}Z"
        fill="#9d9f98"/>
      <g stroke="#675e51" stroke-width="18">${bars}</g>
      <g stroke="#91816b" stroke-width="9">${cross}</g>
      <path d="M0 ${h * 0.84}H${w}" stroke="#e8bd39" stroke-width="35"/>
      <path d="M0 ${h * 0.84}H${w}" stroke="#353a41" stroke-width="17"
        stroke-dasharray="50 50"/>
      <rect x="${w * 0.65}" y="${h * 0.6}" width="${w * 0.24}"
        height="${h * 0.18}" fill="#c96b43"/>
      <path d="M${w * 0.65} ${h * 0.68}H${w * 0.89}" stroke="#6b3e30"
        stroke-width="6"/>
      <text x="22" y="40" font-size="22" fill="#1f2933"
        font-family="sans-serif">DEMO · ${landmark}</text>
      </svg>`;
          const img = new Image();
          img.src =
            "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
          await img.decode();
          pictures[key] = img;
        }
      }

      // 自由框與比例預設共用範圍計算，拖曳和鍵盤調整結果一致。
      function cropBounds(width, height, edit) {
        let w = width,
          h = height;
        const ratio = { square: 1, four: 4 / 3, wide: 16 / 9 }[edit.aspect];
        if (ratio) {
          if (w / h > ratio) w = h * ratio;
          else h = w / ratio;
        }
        if (edit.aspect === "free") {
          w *= edit.cropWidth / 100;
          h *= edit.cropHeight / 100;
        }
        w *= edit.crop / 100;
        h *= edit.crop / 100;
        return {
          w,
          h,
          x: ((width - w) * (edit.cropX ?? 50)) / 100,
          y: ((height - h) * (edit.cropY ?? 50)) / 100,
        };
      }
      // FEV-R22：轉動、裁切與亮度先完成；標示最後畫在延伸畫布。
      function editedCanvas(source, edit) {
        const rotate = document.createElement("canvas");
        const swap = edit.rotation % 180 !== 0;
        rotate.width = swap ? source.height : source.width;
        rotate.height = swap ? source.width : source.height;
        const rc = rotate.getContext("2d");
        rc.translate(rotate.width / 2, rotate.height / 2);
        rc.rotate((edit.rotation * Math.PI) / 180);
        rc.drawImage(source, -source.width / 2, -source.height / 2);
        const { w, h, x, y } = cropBounds(rotate.width, rotate.height, edit);
        const out = document.createElement("canvas");
        out.width = Math.max(64, Math.round(w));
        out.height = Math.max(64, Math.round(h));
        const ctx = out.getContext("2d");
        ctx.filter = `brightness(${1 + edit.brightness / 100})`;
        ctx.drawImage(rotate, x, y, w, h, 0, 0, out.width, out.height);
        return out;
      }
      function fieldCanvas(photo) {
        return editedCanvas(pictures[photo.shape], photo.field);
      }
      function wrap(ctx, text, max) {
        const lines = [];
        let current = "";
        for (const character of text) {
          if (ctx.measureText(current + character).width > max && current) {
            lines.push(current);
            current = "";
          }
          current += character;
        }
        lines.push(current);
        return lines;
      }
      function officeCanvas(photo, edit = photo.office) {
        const body = editedCanvas(fieldCanvas(photo), edit);
        const c = Math.max(body.width, 480),
          size = Math.max(14, Math.floor(0.022 * c + 0.5));
        const pad = Math.max(1, Math.floor(0.01 * c + 0.5));
        const lineHeight = size * 1.4,
          left = Math.round(c * 0.22);
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        ctx.font = `${size}px EvidenceLabel`;
        const values = [
          project,
          items[photo.item],
          locationName,
          "張先生",
          photo.time,
        ];
        const rows = labels.map((label, i) => {
          const a = wrap(ctx, label, left - pad * 2);
          const b = wrap(ctx, values[i], c - left - pad * 2);
          return {
            a,
            b,
            height: Math.ceil(
              Math.max(a.length, b.length) * lineHeight + pad * 2,
            ),
          };
        });
        canvas.width = c;
        canvas.height =
          body.height + rows.reduce((sum, r) => sum + r.height, 0);
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, c, canvas.height);
        ctx.drawImage(body, (c - body.width) / 2, 0);
        ctx.font = `${size}px EvidenceLabel`;
        ctx.fillStyle = "black";
        ctx.strokeStyle = "black";
        ctx.lineWidth = Math.max(1, Math.floor(0.001 * c + 0.5));
        ctx.textBaseline = "middle";
        let y = body.height;
        for (const row of rows) {
          ctx.strokeRect(0.5, y + 0.5, left - 0.5, row.height - 0.5);
          ctx.strokeRect(left, y + 0.5, c - left - 0.5, row.height - 0.5);
          for (const [lines, x] of [
            [row.a, pad],
            [row.b, left + pad],
          ]) {
            const top = y + (row.height - lines.length * lineHeight) / 2;
            lines.forEach((s, i) =>
              ctx.fillText(s, x, top + (i + 0.5) * lineHeight),
            );
          }
          y += row.height;
        }
        return canvas;
      }
      function paint(target, source) {
        target.width = source.width;
        target.height = source.height;
        target.getContext("2d").drawImage(source, 0, 0);
      }
      function paintPhotos() {
        document.querySelectorAll("[data-photo]").forEach((el) => {
          const p = state.photos.find(
            (x) => x.id === Number(el.dataset.photo),
          );
          if (p)
            paint(
              el,
              el.dataset.variant === "office"
                ? officeCanvas(p)
                : fieldCanvas(p),
            );
        });
      }
      function reveal(el) {
        el.scrollIntoView({
          block: el.offsetHeight > innerHeight * 0.8 ? "start" : "nearest",
        });
      }
      function focusHeading() {
        const heading = app.querySelector("h1");
        heading.tabIndex = -1;
        heading.focus({ preventScroll: true });
        reveal(heading);
      }
      function confirmAt(host, title, text, action, danger = false) {
        host.innerHTML = `<section class="confirm" role="group"
    aria-label="${title}"><h3>${title}</h3><p>${text}</p>
    <div class="actions">${button("取消", "cancel-confirm")}
    ${button(title, "do-confirm", danger ? "danger danger-fill" : "primary")}
    </div></section>`;
        reveal(host);
        const cancel = host.querySelector("button");
        cancel.focus({ preventScroll: true });
        host.querySelector("[data-action=cancel-confirm]").onclick = () => {
          host.innerHTML = "";
          host.previousElementSibling
            ?.querySelector("button")
            ?.focus({ preventScroll: true });
        };
        host.querySelector("[data-action=do-confirm]").onclick = action;
        host.onkeydown = (e) => {
          if (e.key === "Escape") {
            e.stopPropagation();
            cancel.click();
          }
        };
      }
      function feedback(text) {
        message = text;
        const host = $("#feedback");
        if (host) {
          host.innerHTML = `<div class="feedback" role="status"
      tabindex="-1">${escapeHtml(text)}</div>`;
          reveal(host);
        }
      }
      function card(p) {
        const deleteButton =
          p.status === "active"
            ? button("刪除照片", "delete:" + p.id, "danger")
            : "";
        return `<article class="photo-card" data-card="${p.id}">
    <canvas data-photo="${p.id}" aria-label="${escapeHtml(p.caption)}"
      role="img"></canvas>${badge(p)}
    <h3>${escapeHtml(p.caption || "未填註記")}</h3>
    <p>${
      p.overview
        ? "總覽照片（選拍）"
        : "佐證項次：" +
          p.points

      function bindEditor() {
        for (const key of [
          "aspect",
          "crop",
          "brightness",
          "zoom",
          "cropWidth",
          "cropHeight",
          "cropX",
          "cropY",
        ]) {
          $("#" + key).value = editing[key];
          $("#" + key).oninput = (e) => {
            editing[key] =
              key === "aspect" ? e.target.value : Number(e.target.value);
            dirty = true;

          };
        }
        const canvas = $("#editor-canvas");
        let start = null;
        canvas.onpointerdown = (e) => {
          start = { x: e.clientX, y: e.clientY };
          canvas.setPointerCapture(e.pointerId);
        };
        canvas.onpointermove = (e) => {
          if (!start) return;
          editing.x = Math.max(
            -80,
            Math.min(80, editing.x + e.clientX - start.x),
          );
          editing.y = Math.max(
            -80,
            Math.min(80, editing.y + e.clientY - start.y),
          );
          start = { x: e.clientX, y: e.clientY };
          editPreview();
        };
        canvas.onpointerup = () => {
          start = null;
        };
        const map = $("#crop-map");
        let moving = false;
        const moveCrop = (e) => {
          const box = map.getBoundingClientRect();
          const bounds = cropBounds(map.width, map.height, editing);
          const x =
            ((e.clientX - box.x) / box.width) * map.width - bounds.w / 2;
          const y =
            ((e.clientY - box.y) / box.height) * map.height - bounds.h / 2;
          editing.cropX =
            map.width === bounds.w
              ? 50
              : Math.round(
                  Math.max(
                    0,
                    Math.min(100, (x / (map.width - bounds.w)) * 100),
                  ),
                );
          editing.cropY =
            map.height === bounds.h
              ? 50
              : Math.round(
                  Math.max(
                    0,
                    Math.min(100, (y / (map.height - bounds.h)) * 100),
                  ),
                );
          $("#cropX").value = editing.cropX;
          $("#cropY").value = editing.cropY;
          dirty = true;
          editPreview();
        };
        map.onpointerdown = (e) => {
          moving = true;
          map.setPointerCapture(e.pointerId);
          moveCrop(e);
        };

          if (moving) moveCrop(e);
        };

          moving = false;
        };

          const host = $("#navigation-confirm");
          confirmAt(
            host,
            "放棄未完成操作並切換",
            "未確認的編修或待上傳照片會遺失；已上傳資料會沿用。",
            () => {
              upload = null;
              dirty = false;
              draft = null;
              go();
            },
            true,
          );
        } else go();
      }
      function bind() {
        document.querySelectorAll("[data-action]").forEach((el) => {
          if (["do-confirm", "cancel-confirm"].includes(el.dataset.action))
            return;
          el.onclick = () => act(el.dataset.action);
        });
        if ($("#filter")) {
          $("#filter").value = filter;
          $("#filter").onchange = (e) => {
            filter = e.target.value;
            home();
            $("#filter").focus({ preventScroll: true });
          };
        }
      }
      function act(action) {
        const [name, value] = action.split(":");
        if (name === "capture") return capture(value);
        if (name === "choose") {
          draft.shape = value;
          editing = cleanEdit();
          dirty = true;
          return fieldEditor();
        }
        if (name === "home") {
          home();
          focusHeading();
          return;
        }
        if (name === "next") return targetForm();
        if (name === "rotate") {
          editing.rotation = (editing.rotation + 90) % 360;
          dirty = true;
          return editPreview();
        }
        if (name === "reset-edit") {
          editing = cleanEdit();
          dirty = true;
          bindEditor();
          return;
        }
        if (name === "pan") {
          const key = ["left", "right"].includes(value) ? "x" : "y";
          editing[key] = Math.max(
            -80,
            Math.min(
              80,
              editing[key] + (["left", "up"].includes(value) ? -20 : 20),
            ),
          );
          return editPreview();
        }
        if (name === "leave-editor" || name === "leave-office") {
          return confirmAt(
            $("#leave-confirm"),
            "放棄未儲存變更",
            "尚未確認的編修與輸入不會保存，已上傳照片不受影響。",
            () => {
              if (name === "leave-office") officeDetail(selected.id);
              else home();
            },
            true,
          );
        }
        if (name === "retry") {
          upload.scenario = "success";
          upload.status = "uploading";
          queue();
          return tryUpload(upload.token);
        }
        if (name === "abandon")
          return confirmAt(
            $("#abandon-confirm"),
            "確認放棄這張照片",
            "這張尚未上傳的照片將從此頁移除，需要時請重新拍攝。",
            () => {
              upload = null;
              message = "已放棄待上傳照片。";
              home();
              $("#feedback [role=status]").focus({ preventScroll: true });
            },
            true,
          );
        if (name === "modify") {
          draft = structuredClone(
            state.photos.find((p) => p.id === Number(value)),
          );
          return targetForm(true);
        }
        if (name === "delete")
          return confirmAt(
            $("#confirm-" + value),
            "確認刪除照片",
            "照片將不再計入覆蓋數，從現場清單移除；內業仍可查到已刪除紀錄。",
            () => {
              state.photos.find((p) => p.id === Number(value)).status =
                "deleted";
              message = "照片已刪除，歷史紀錄保留。";
              home();
              $("#feedback [role=status]").focus({ preventScroll: true });
            },
            true,
          );
        if (name === "open") return officeDetail(Number(value));
        if (name === "zoom-label") return openLabelViewer();
        if (name === "version") return setVersion(value);
        if (name === "office-edit") return officeEditor();
        if (name === "apply")
          return confirmAt(
            $("#apply-confirm"),
            "確認套用內業版",
            "會直接更新內業版，不保留舊內業版；現場版不變。",
            () => {
              selected.office = { ...editing, zoom: 1, x: 0, y: 0 };
              const id = selected.id;
              officeDetail(id);
              const note = document.createElement("p");
              note.className = "feedback";
              note.setAttribute("role", "status");
              note.textContent = "已套用內業版，現場版不變。";
              app.querySelector("section").prepend(note);
              reveal(note);
            },
          );
        if (name === "standard")
          return confirmAt(
            $("#standard-confirm"),
            "確認依新標準重新查核",
            "只將鋼筋工程的有效照片標為標準變更作廢；其他項目不變。",
            () => {
              state.photos
                .filter((p) => p.item === 0 && p.status === "active")
                .forEach((p) => {
                  p.status = "void";
                });
              state.recheck = true;
              message = "鋼筋工程已標待重查；請切換現場補拍。";
              home();
              $("#feedback [role=status]").focus({ preventScroll: true });
            },
          );
        if (name === "download") {
          const a = document.createElement("a");
          a.download = "內業版示意.jpg";
          a.href = officeCanvas(selected).toDataURL("image/jpeg", 0.9);
          a.click();
        }
      }
      $("#switch").onclick = navigateOther;
      $("#label-close").onclick = () => $("#label-viewer").close();
      $("#label-zoom").oninput = zoomLabel;
      document.querySelectorAll("[data-label-pan]").forEach((button) => {
        button.onclick = () => {
          const direction = button.dataset.labelPan;
          $("#label-viewport").scrollBy({
            left:
              direction === "left" ? -160 : direction === "right" ? 160 : 0,
            top: direction === "up" ? -120 : direction === "down" ? 120 : 0,
          });
        };
      });
      function setHelp(open) {
        $("#prototype-help").hidden = !open;
        $("#help-toggle").setAttribute("aria-expanded", String(open));
      }
      $("#help-toggle").onclick = () => setHelp($("#prototype-help").hidden);
      $("#help-close").onclick = () => {
        setHelp(false);
        $("#help-toggle").focus({ preventScroll: true });
      };
      function closePerson() {
        $("#person-menu").hidden = true;
        $("#person-trigger").setAttribute("aria-expanded", "false");
      }
      $("#person-trigger").onclick = () => {
        const open = $("#person-menu").hidden;
        $("#person-menu").hidden = !open;
        $("#person-trigger").setAttribute("aria-expanded", String(open));
        if (open) {
          setHelp(false);
          $("#person-menu button").focus({ preventScroll: true });
        }
      };
      document.querySelectorAll("[data-person]").forEach((button) => {
        button.onclick = () => {
          const note = $("#person-note");
          note.hidden = false;
          note.textContent =
            button.dataset.person === "settings"
              ? "此原型只展示照片流程；外觀可由上方工具列調整。"
              : "此原型沒有連接正式帳號；關閉頁面即可結束試用。";
        };
      });
      document.querySelectorAll("[data-shell]").forEach((button) => {
        button.onclick = () => {
          if (draft || dirty || upload) {
            confirmAt(
              $("#navigation-confirm"),
              "放棄未完成操作並返回",
              "未確認的編修或待上傳照片會遺失；已上傳資料會保留。",
              () => {
                upload = null;
                draft = null;
                dirty = false;
                home();
              },
              true,
            );
            return;
          }
          if (button.dataset.shell === "projects" && mode === "field") {
            setShellCurrent("projects");
            app.innerHTML = `<section class="panel"><h1>我的專案</h1>
        <h2>${project}</h2><p>這是照片原型中的專案入口示意。</p>
        ${buttonHtmlBack()}</section>`;
            bind();
            focusHeading();
          } else home();
        };
      });
      function setShellCurrent(section) {
        document.querySelectorAll("[data-shell]").forEach((button) => {
          if (button.dataset.shell === section)
            button.setAttribute("aria-current", "page");
          else button.removeAttribute("aria-current");
        });
      }
      function buttonHtmlBack() {
        return button("返回照片任務", "home");
      }
      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape" || $("#label-viewer").open) return;
        if (!$("#person-menu").hidden) {
          closePerson();
          $("#person-trigger").focus({ preventScroll: true });
        } else if (!$("#prototype-help").hidden) {
          setHelp(false);
          $("#help-toggle").focus({ preventScroll: true });
        }
      });
      document.addEventListener("click", (event) => {
        if (!event.target.closest(".account")) closePerson();
      });
      $("#theme").onchange = (e) => {
        document.documentElement.dataset.theme = e.target.value;
        state.theme = e.target.value;
      };
      // 原型的選項支援明確方向鍵路徑，滑鼠仍沿用原生選單。
      document.addEventListener("keydown", (event) => {
        const el = event.target;
        if (
          !(el instanceof HTMLSelectElement) ||
          event.altKey ||
          event.ctrlKey ||
          event.metaKey ||
          event.shiftKey
        )
          return;
        if (!["ArrowDown", "ArrowUp", "Home", "End"].includes(event.key))
          return;
        event.preventDefault();
        const last = el.options.length - 1;
        const index =
          event.key === "Home"
            ? 0
            : event.key === "End"
              ? last
              : Math.max(
                  0,
                  Math.min(
                    last,
                    el.selectedIndex + (event.key === "ArrowDown" ? 1 : -1),
                  ),
                );
        el.selectedIndex = index;
        el.dispatchEvent(new Event("input", { bubbles: true }));
        el.dispatchEvent(new Event("change", { bubbles: true }));
      });
      window.addEventListener("beforeunload", (e) => {
        if (dirty || draft || upload) {
          e.preventDefault();
          e.returnValue = "";
        }
      });
      // URL 只攜帶已上傳示意資料與參數，兩份原型可接續狀態。
      // 未確認草稿、待上傳照片、圖片位元組不進 URL 或持久儲存。
      async function boot() {
        $("#theme").value = state.theme || "light";
        document.documentElement.dataset.theme = state.theme || "light";
        const raw = $("#label-font").textContent.replace(/\s/g, "");
        const font = new FontFace(
          "EvidenceLabel",
          "url(data:font/woff2;base64," + raw + ")",
        );
        document.fonts.add(await font.load());
        await loadPictures();
        home();
        document.body.dataset.ready = "true";
      }
      boot().catch(() => {
        app.innerHTML = '<p role="alert">原型初始化失敗，請重新開啟檔案。</p>';
      });
    </script>
  </body>
</html>
