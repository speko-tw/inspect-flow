    <style>
      :root,
      :root[data-theme="light"] {
        color-scheme: light;

        --color-brand-primary: #002060;
        --color-brand-accent: #ffc200;
        --color-header-nav-hover: rgba(255, 255, 255, 0.11);
        --color-header-nav-pressed: rgba(255, 255, 255, 0.19);
        --color-header-nav-current: rgba(255, 255, 255, 0.15);
        --color-bg-page: #f3f6fa;
        --color-bg-surface: #ffffff;

        --color-bg-muted: #eaf0f7;

        --color-text-secondary: #536174;
        --color-text-inverse: #ffffff;
        --color-text-disabled: #536174;
        --color-text-on-accent: #202b3b;
        --color-border: #d4dce7;

        --color-status-warning: #765000;
        --color-status-warning-bg: #fff3cf;
        --color-status-warning-border: #765000;
        --color-status-danger: #a12b25;
        --color-status-danger-bg: #fff0ed;
        --color-status-danger-border: #a12b25;
        --color-status-info: #00577d;
        --color-status-info-bg: #e5f4fb;
        --color-status-info-border: #00577d;
        --color-status-neutral: #46566b;
        --color-status-neutral-bg: #edf1f5;
        --color-status-neutral-border: #46566b;

        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 20px;
        --space-6: 24px;
        --space-8: 32px;

        --radius-sm: 4px;

        --color-text-secondary: #b8c5d6;

        --color-border: #344960;
        --color-border-control: #8298b2;

        --color-link: #aad0ff;
        --color-action-primary: #8cc4ff;
        --color-action-primary-hover: #a8d2ff;
        --color-text-on-primary: #0b1422;
        --color-action-danger-hover: #ffb9b2;
        --color-text-on-danger: #24100e;

        --color-status-success-border: #8de1aa;
        --color-status-warning: #ffda82;
        --color-status-warning-bg: #45371a;
        --color-status-warning-border: #ffda82;
        --color-status-danger: #ffaaa0;
        --color-status-danger-bg: #482722;
        --color-status-danger-border: #ffaaa0;
        --color-status-info: #9cddf3;
        --color-status-info-bg: #15384b;
        --color-status-info-border: #9cddf3;
        --color-status-neutral: #c2cfdd;
        --color-status-neutral-bg: #283a4e;
        --color-status-neutral-border: #c2cfdd;
        --shadow-header: 0 1px 0 rgb(255 255 255 / 7%);
        --shadow-panel: 0 8px 28px rgb(0 0 0 / 18%);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]),
        :root[data-theme="system"] {
          color-scheme: dark;

          --color-bg-page: #0b1422;

          --color-border-strong: #8298b2;
          --color-focus: #82c9f2;
          --color-selection: #8cc4ff;
          --color-selected-bg: #2a4666;
          --color-link: #aad0ff;
          --color-action-primary: #8cc4ff;
          --color-action-primary-hover: #a8d2ff;
          --color-text-on-primary: #0b1422;
          --color-action-danger-hover: #ffb9b2;
          --color-text-on-danger: #24100e;
          --color-status-success: #8de1aa;
          --color-status-success-bg: #153b2a;
          --color-status-success-border: #8de1aa;
          --color-status-warning: #ffda82;
          --color-status-warning-bg: #45371a;
          --color-status-warning-border: #ffda82;
          --color-status-danger: #ffaaa0;
          --color-status-danger-bg: #482722;
          --color-status-danger-border: #ffaaa0;
          --color-status-info: #9cddf3;
          --color-status-info-bg: #15384b;
          --color-status-info-border: #9cddf3;
          --color-status-neutral: #c2cfdd;
          --color-status-neutral-bg: #283a4e;
          --color-status-neutral-border: #c2cfdd;
          --shadow-header: 0 1px 0 rgb(255 255 255 / 7%);
          --shadow-panel: 0 8px 28px rgb(0 0 0 / 18%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        :root:not([data-theme]),
        :root[data-theme="system"],
        :root[data-theme="light"],
        :root[data-theme="dark"] {
          --motion-fast: 0ms;

        }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--color-bg-page);
        color: var(--color-text-primary);
        font: 15px/1.58 var(--font-family-sans);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        min-width: 44px;
        padding: 8px 16px;
        border: 1px solid var(--color-border-control);
        border-radius: 4px;
        background: var(--color-bg-surface);
        color: var(--color-text-primary);
        cursor: pointer;
        text-decoration: none;
        font-weight: 500;
      }
      button:hover,
      .button:hover {
        background: var(--color-bg-muted);
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .primary {
        min-height: 48px;
        padding: 8px 24px;
        font-weight: 700;
        border: 2px solid var(--color-action-primary);
        background: var(--color-action-primary);
        color: var(--color-text-on-primary);
        min-width: 128px;
      }
      .primary:hover {
        background: var(--color-action-primary-hover);
      }
      .danger {
        border: 2px solid var(--color-status-danger);
        color: var(--color-status-danger);
      }
      .danger-fill {
        background: var(--color-status-danger);
        color: var(--color-text-on-danger);
      }
      .danger-fill:hover {
        background: var(--color-action-danger-hover);
      }
      :focus-visible {
        outline: 3px solid var(--color-focus);
        outline-offset: 3px;
      }
      header {
        background: var(--color-brand-primary);
        color: white;
        border-bottom: 3px solid var(--color-brand-accent);
      }
      .header-inner {
        max-width: 1152px;
        margin: auto;
        padding: 16px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
      }
      .brand {
        font-size: 19px;
        font-weight: 700;
      }
      .user {
        font-size: 14px;
      }
      .header-nav {
        display: flex;
        gap: 24px;
        max-width: 1152px;
        padding: 0 24px;
        margin: auto;
      }
      .header-nav span {
        padding: 8px 4px;
        border-bottom: 3px solid var(--color-brand-accent);
      }
      main {
        max-width: 1152px;
        margin: auto;
        padding: 24px;
      }
      .prototype-note {
        background: var(--color-bg-muted);
        border: 1px solid var(--color-border);
        border-radius: 4px;
        padding: 12px 16px;
        margin-bottom: 24px;
      }
      .prototype-note p {
        margin: 4px 0;
      }
      .tools,
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .tools {
        margin-top: 12px;
      }
      .tools label {
        display: flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
      }
      .tools select {
        width: auto;
        min-width: 108px;
      }
      .hero,
      .panel,
      .photo-card {
        background: var(--color-bg-surface);
        border: 1px solid var(--color-border);
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 16px;
      }
      .hero {
        border-inline-start: 4px solid var(--color-status-info);
      }
      h1 {
        font-size: 24px;
        line-height: 1.3;
        margin: 4px 0 12px;
      }
      h2 {
        font-size: 20px;
        margin: 0 0 12px;
      }
      h3 {
        font-size: 17px;
        margin: 0 0 8px;
      }
      p {
        margin: 8px 0 16px;
        overflow-wrap: anywhere;
      }
      small,
      .muted {
        color: var(--color-text-secondary);
      }
      .badge {
        display: inline-block;
        padding: 2px 10px;
        border: 1px solid var(--color-status-info-border);
        border-radius: 4px;
        color: var(--color-status-info);
        background: var(--color-status-info-bg);
        font-size: 14px;
      }
      .success {
        color: var(--color-status-success);
        background: var(--color-status-success-bg);
        border-color: var(--color-status-success-border);
      }
      .warning {
        color: var(--color-status-warning);
        background: var(--color-status-warning-bg);
        border-color: var(--color-status-warning-border);
      }
      .notice,
      .confirm {
        border: 1px solid var(--color-status-warning);
        border-inline-start-width: 4px;
        padding: 16px;
        border-radius: 4px;
        background: var(--color-status-warning-bg);
        color: var(--color-text-primary);
        margin: 12px 0;
      }
      .notice p,
      .confirm p {
        margin: 4px 0 12px;
      }
      .feedback {
        padding: 12px;
        border: 1px solid var(--color-status-success-border);
        background: var(--color-status-success-bg);
        margin: 12px 0;
      }
      .error {
        color: var(--color-status-danger);
        font-weight: 600;
      }
      .point {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 0;
        border-top: 1px solid var(--color-border);
        align-items: center;
      }
      .point p {
        margin: 4px 0;
      }
      .step-list {
        display: flex;
        gap: 20px;
        padding: 0 0 16px;
        list-style: none;
        border-bottom: 1px solid var(--color-border);
      }
      .step-list .current {
        font-weight: 700;
        border-bottom: 3px solid var(--color-selection);
      }
      .preview {
        background: var(--color-bg-muted);
        padding: 16px;
        border: 1px solid var(--color-border);
        border-radius: 4px;
        overflow: hidden;
        text-align: center;
        touch-action: pan-y;
      }
      canvas {
        max-width: 100%;
        height: auto;
        vertical-align: middle;
      }
      .preview canvas {
        max-height: 440px;
        width: auto;
      }
      .crop-map {
        display: block;
        width: auto;
        max-width: 100%;
        max-height: 160px;
        cursor: move;
        touch-action: none;
      }
      .editor-grid {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 24px;
        align-items: start;
      }
      .controls {
        display: grid;
        gap: 12px;
      }
      .controls label {
        display: grid;
        gap: 4px;
      }
      input:not([type="checkbox"]),
      select,
      textarea {
        width: 100%;
        min-height: 44px;
        background: var(--color-bg-surface);
        color: var(--color-text-primary);
        border: 1px solid var(--color-border-control);
        border-radius: 4px;
        padding: 8px 12px;
      }
      input[type="range"] {
        padding: 0;
        accent-color: var(--color-selection);
      }
      input[type="checkbox"] {
        width: 22px;
        height: 22px;
        accent-color: var(--color-selection);
        flex-shrink: 0;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 48px;
        padding: 8px;
      }
      fieldset {
        border: 1px solid var(--color-border-control);
        border-radius: 4px;
        margin: 16px 0;
        padding: 12px;
      }
      legend {
        padding: 0 8px;
        font-weight: 600;
      }
      textarea {
        min-height: 88px;
        resize: vertical;
      }
      .photo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr));
        gap: 16px;
      }
      .photo-card {
        padding: 16px;
        margin: 0;
      }
      .photo-card canvas {
        display: block;
        width: 100%;
        max-height: 220px;
        object-fit: contain;
        background: var(--color-bg-muted);
        margin-bottom: 12px;
      }
      .photo-card p {
        margin: 8px 0;
      }
      .compare {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-block: 16px;
        align-items: start;
      }
      figure {
        margin: 0;
        min-width: 0;
      }
      figure canvas {
        width: 100%;
        display: block;
      }
      figcaption {
        padding: 8px 0;
        font-weight: 600;
      }
      .segmented {
        display: flex;
        gap: 4px;
        padding: 4px;
        background: var(--color-bg-muted);
        width: fit-content;
      }
      .segmented button[aria-pressed="true"] {
        border: 2px solid var(--color-selection);
        background: var(--color-selected-bg);
        font-weight: 700;
      }
      .segmented button[aria-pressed="true"]::before {
        content: "✓ ";
      }
      .mobile-versions {
        display: none;
      }
      .section-title {
        margin-top: 24px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--color-border);
      }
      .inline-host {
        scroll-margin-block: 20px;
      }
      .hidden,
      [hidden] {
        display: none !important;
      }
      .back {
        margin-bottom: 16px;
      }
      footer {
        margin-top: 32px;
        color: var(--color-text-secondary);
      }
      @media (max-width: 640px) {
        main {
          padding: 16px;
        }
        .header-inner {
          padding: 12px 16px;
        }
        .header-nav {
          padding: 0 16px;
        }
        .brand {
          font-size: 17px;
        }
        .hero,
        .panel {
          padding: 16px;
        }
        .editor-grid,
        .compare {
          grid-template-columns: 1fr;
          gap: 16px;
        }
        .compare [data-version][hidden] {
          display: none;
        }
        .mobile-versions {
          display: flex;
        }
        .step-list {
          flex-direction: column;
          gap: 4px;
        }
        .point {
          align-items: flex-start;
          flex-direction: column;
        }
        .point button,
        .primary {
          width: 100%;
        }
        .actions {
          align-items: stretch;
        }
        .actions button {
          flex: 1 1 120px;
        }
        .tools {
          align-items: stretch;
          flex-direction: column;
        }
        .tools label {
          flex-wrap: wrap;
        }
        .tools select {
          flex: 1;
          min-width: 100px;
        }
        .preview {
          padding: 8px;
        }
      }
    </style>
  </head>
  <body data-mode="field">
    <header>
      <div class="header-inner">
        <div class="brand">InspectFlow 工程查核系統</div>
        <div class="user">登入者：陳怡君</div>
      </div>
      <nav class="header-nav" aria-label="目前工作區">
        <span aria-current="page">任務</span>
      </nav>
    </header>
    <main>
      <aside class="prototype-note" aria-label="原型試用說明">
        <strong>互動原型・待負責人操作核可</strong>
        <p>
          假資料與工地示意圖，未連接正式系統。可離線操作。
          切換兩份原型會沿用已上傳的示意資料；重新開啟不帶網址片段的檔案可重置。
        </p>
        <div class="tools">
          <label for="theme"
            >外觀
            <select id="theme">
              <option value="light">淺色</option>
              <option value="dark">深色</option>
              <option value="system">跟隨裝置</option>
            </select></label
          >
          <button id="switch" type="button">切換到內業原型</button>
        </div>

      // 自由框與比例預設共用範圍計算，拖曳和鍵盤調整結果一致。
      function cropBounds(width, height, edit) {
        let w = width,
          h = height;
        const ratio = { square: 1, four: 4 / 3, wide: 16 / 9 }[edit.aspect];
        if (ratio) {
          if (w / h > ratio) w = h * ratio;
          else h = w / ratio;
        }
        if (edit.aspect === "free") {
          w *= edit.cropWidth / 100;
          h *= edit.cropHeight / 100;
        }
        w *= edit.crop / 100;
        h *= edit.crop / 100;
        return {
          w,
          h,
          x: ((width - w) * (edit.cropX ?? 50)) / 100,
          y: ((height - h) * (edit.cropY ?? 50)) / 100,
        };
      }
      // FEV-R22：轉動、裁切與亮度先完成；標示最後畫在延伸畫布。
      function editedCanvas(source, edit) {
        const rotate = document.createElement("canvas");
        const swap = edit.rotation % 180 !== 0;
        rotate.width = swap ? source.height : source.width;
        rotate.height = swap ? source.width : source.height;
        const rc = rotate.getContext("2d");
        rc.translate(rotate.width / 2, rotate.height / 2);
        rc.rotate((edit.rotation * Math.PI) / 180);
        rc.drawImage(source, -source.width / 2, -source.height / 2);
        const { w, h, x, y } = cropBounds(rotate.width, rotate.height, edit);
        const out = document.createElement("canvas");
        out.width = Math.max(64, Math.round(w));
        out.height = Math.max(64, Math.round(h));
        const ctx = out.getContext("2d");
        ctx.filter = `brightness(${1 + edit.brightness / 100})`;
        ctx.drawImage(rotate, x, y, w, h, 0, 0, out.width, out.height);
        return out;
      }
      function fieldCanvas(photo) {
        return editedCanvas(pictures[photo.shape], photo.field);
      }
      function wrap(ctx, text, max) {
        const lines = [];
        let current = "";
        for (const character of text) {
          if (ctx.measureText(current + character).width > max && current) {
            lines.push(current);
            current = "";
          }
          current += character;
        }
        lines.push(current);
        return lines;
      }
      function officeCanvas(photo, edit = photo.office) {
        const body = editedCanvas(fieldCanvas(photo), edit);
        const c = Math.max(body.width, 480),
          size = Math.max(14, Math.floor(0.022 * c + 0.5));
        const pad = Math.max(1, Math.floor(0.01 * c + 0.5));
        const lineHeight = size * 1.4,
          left = Math.round(c * 0.22);
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        ctx.font = `${size}px EvidenceLabel`;
        const values = [
          project,
          items[photo.item],
          locationName,
          "陳怡君",
          photo.time,
        ];
        const rows = labels.map((label, i) => {
          const a = wrap(ctx, label, left - pad * 2);
          const b = wrap(ctx, values[i], c - left - pad * 2);
          return {
            a,
            b,
            height: Math.ceil(
              Math.max(a.length, b.length) * lineHeight + pad * 2,
            ),
          };
        });
        canvas.width = c;
        canvas.height =
          body.height + rows.reduce((sum, r) => sum + r.height, 0);
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, c, canvas.height);
        ctx.drawImage(body, (c - body.width) / 2, 0);
        ctx.font = `${size}px EvidenceLabel`;
        ctx.fillStyle = "black";
        ctx.strokeStyle = "black";
        ctx.lineWidth = Math.max(1, Math.floor(0.001 * c + 0.5));
        ctx.textBaseline = "middle";
        let y = body.height;
        for (const row of rows) {
          ctx.strokeRect(0.5, y + 0.5, left - 0.5, row.height - 0.5);
          ctx.strokeRect(left, y + 0.5, c - left - 0.5, row.height - 0.5);
          for (const [lines, x] of [
            [row.a, pad],
            [row.b, left + pad],
          ]) {
            const top = y + (row.height - lines.length * lineHeight) / 2;
            lines.forEach((s, i) =>
              ctx.fillText(s, x, top + (i + 0.5) * lineHeight),
            );
          }
          y += row.height;
        }
        return canvas;
      }
      function paint(target, source) {
        target.width = source.width;
        target.height = source.height;
        target.getContext("2d").drawImage(source, 0, 0);
      }
      function paintPhotos() {

      function editPreview() {
        let source;
        if (mode === "office") source = officeCanvas(selected, editing);
        else source = editedCanvas(pictures[draft.shape], editing);
        const canvas = $("#editor-canvas");
        paint(canvas, source);
        canvas.style.transform =

          `scale(${editing.zoom})`;
        $("#crop-value").textContent = editing.crop + "%";
        $("#brightness-value").textContent = editing.brightness;
        $("#free-size").hidden = editing.aspect !== "free";
        const raw =
          mode === "office" ? fieldCanvas(selected) : pictures[draft.shape];
        const rotated = editedCanvas(raw, {
          ...editing,
          aspect: "original",
          crop: 100,
          brightness: 0,
        });
        const map = $("#crop-map");
        paint(map, rotated);
        const bounds = cropBounds(map.width, map.height, editing);
        const ctx = map.getContext("2d");
        ctx.strokeStyle = "black";
        ctx.lineWidth = Math.max(4, map.width * 0.008);
        ctx.strokeRect(bounds.x, bounds.y, bounds.w, bounds.h);
        ctx.strokeStyle = "white";
        ctx.lineWidth = Math.max(2, map.width * 0.003);
        ctx.strokeRect(bounds.x, bounds.y, bounds.w, bounds.h);
      }
      function bindEditor() {
        for (const key of [
          "aspect",
          "crop",
          "brightness",
          "zoom",
          "cropWidth",
          "cropHeight",
          "cropX",
          "cropY",
        ]) {
          $("#" + key).value = editing[key];
          $("#" + key).oninput = (e) => {
            editing[key] =
              key === "aspect" ? e.target.value : Number(e.target.value);
            dirty = true;
            editPreview();
          };
        }
        const canvas = $("#editor-canvas");
        let start = null;
        canvas.onpointerdown = (e) => {
          start = { x: e.clientX, y: e.clientY };
          canvas.setPointerCapture(e.pointerId);
        };
        canvas.onpointermove = (e) => {
          if (!start) return;
          editing.x = Math.max(
            -80,
            Math.min(80, editing.x + e.clientX - start.x),
          );
          editing.y = Math.max(
            -80,
            Math.min(80, editing.y + e.clientY - start.y),
          );
          start = { x: e.clientX, y: e.clientY };
          editPreview();
        };
        canvas.onpointerup = () => {
          start = null;
        };
        const map = $("#crop-map");
        let moving = false;
        const moveCrop = (e) => {
          const box = map.getBoundingClientRect();
          const bounds = cropBounds(map.width, map.height, editing);
          const x =
            ((e.clientX - box.x) / box.width) * map.width - bounds.w / 2;
          const y =
            ((e.clientY - box.y) / box.height) * map.height - bounds.h / 2;
          editing.cropX =
            map.width === bounds.w
              ? 50
              : Math.round(
                  Math.max(
                    0,
                    Math.min(100, (x / (map.width - bounds.w)) * 100),
                  ),
                );
          editing.cropY =
            map.height === bounds.h
              ? 50
              : Math.round(
                  Math.max(
                    0,
                    Math.min(100, (y / (map.height - bounds.h)) * 100),
                  ),
                );
          $("#cropX").value = editing.cropX;
          $("#cropY").value = editing.cropY;
          dirty = true;
          editPreview();
        };
        map.onpointerdown = (e) => {
          moving = true;
          map.setPointerCapture(e.pointerId);
          moveCrop(e);
        };
        map.onpointermove = (e) => {
          if (moving) moveCrop(e);
        };
        map.onpointerup = () => {
          moving = false;
        };
        editPreview();
      }
      function capture(point) {
        if (upload) {
          feedback("請先完成待上傳照片，或確認放棄，再拍下一張。");
          return;
        }
        draft = {
          shape: "wide",
          points: point === "overview" ? [] : [point],
          overview: point === "overview",
          item: point === "c" ? 1 : 0,
        };
        app.innerHTML = `<section class="panel"><h1>拍照或選圖</h1>
    <p>這是離線原型：請選內建工地示意圖，代替裝置相機。</p>
    <div class="actions">${button("使用橫向示意圖", "choose:wide", "primary")}
    ${button("使用直向示意圖", "choose:tall")}
    ${button("返回任務", "home")}</div></section>`;
        bind();
        focusHeading();
      }
      function fieldEditor() {
        app.innerHTML = `<section class="panel"><h1>編修現場照片</h1>
    <ol class="step-list"><li class="current">1. 編修</li>
    <li>2. 選項次與註記</li><li>3. 上傳</li></ol>
    ${editorMarkup()}<div class="actions" style="margin-top:20px">
    ${button("確認編修", "next", "primary")}
    ${button("返回任務", "leave-editor")}</div>
    <div id="leave-confirm" class="inline-host"></div></section>`;
        bind();
        bindEditor();
        focusHeading();
      }
      function targetForm(existing = false) {
        const points = draft.points || [];
        app.innerHTML = `<section class="panel"><h1>${
          existing ? "修改說明與項次" : "選擇佐證項次與註記"
        }</h1>
    <p>查核項目：${items[draft.item]}</p>
    ${existing ? "" : "<p>2. 選項次與註記 · 下一步確認上傳</p>"}
    <form id="target-form" novalidate>
    <label class="check"><input id="overview" type="checkbox"
      ${draft.overview ? "checked" : ""} ${existing ? "disabled" : ""}>
      總覽照片（不計入項次需求）</label>
    <fieldset id="points"><legend>佐證項次（非總覽必選，可複選）</legend>
    ${(draft.item === 1
      ? [["c", "1. 牆柱表面品質"]]
      : [
          ["a", "1. 鋼筋間距符合配置圖"],
          ["b", "2. 續接器完整鎖固"],
        ]
    )
      .map(
        ([id, title]) => `<label class="check"><input name="point"
      type="checkbox" value="${id}" aria-describedby="point-error"
      ${points.includes(id) ? "checked" : ""}>
      ${title}</label>`,
      )
      .join("")}
    <p id="point-error" class="error" role="alert" hidden>
    請至少選擇一個佐證項次。</p>
    </fieldset><label for="caption">照片註記（選填，最多 500 字）</label>
    <textarea id="caption" maxlength="500">${escapeHtml(
      draft.caption || "",
    )}</textarea>
    ${
      existing
        ? ""
        : `<label for="network">本次試用的上傳情境</label>
      <select id="network"><option value="success">正常上傳</option>
      <option value="recover">前三次失敗，自動重試後成功</option>
      <option value="fail">持續失敗，改用手動重送</option></select>`
    }
    <div class="actions" style="margin-top:20px">
    <button class="primary" type="submit">${
      existing ? "儲存修改" : "上傳現場照片"
    }</button>
    ${button("返回任務", "leave-editor")}</div></form>
    <div id="leave-confirm" class="inline-host"></div></section>`;
        const update = () => {
          const overview = $("#overview").checked;
          $("#points").disabled = overview;
          if (overview)
            document.querySelectorAll("[name=point]").forEach((el) => {
              el.checked = false;
            });
        };
        $("#overview").onchange = update;
        update();
        $("#target-form").onsubmit = (e) => {
          e.preventDefault();
          const overview = $("#overview").checked;
          const selectedPoints = [
            ...document.querySelectorAll("[name=point]:checked"),
          ].map((x) => x.value);
          if (!overview && !selectedPoints.length) {
            $("#point-error").hidden = false;
            const first = $("[name=point]");
            first.setAttribute("aria-invalid", "true");
            reveal($("#points"));
            first.focus({ preventScroll: true });
            return;
          }
          draft.points = selectedPoints;
          draft.overview = overview;
          draft.caption = $("#caption").value;
          if (existing) {
            Object.assign(
              state.photos.find((p) => p.id === draft.id),
              draft,
            );
            message = "已儲存照片說明與項次。";
            home();
            $("#feedback [role=status]").focus({ preventScroll: true });
          } else startUpload($("#network").value);
        };
        bind();
        focusHeading();
      }
      let upload = null;
      function startUpload(scenario) {
        const photo = {
          ...draft,
          id: state.next++,
          status: "active",
          field: { ...editing },
          office: cleanEdit(),
          time: "2026/10/31 10:24",
        };
        // 不把待上傳的影像或草稿寫進任何瀏覽器持久儲存。
        upload = {
          photo,
          scenario,
          attempt: 0,
          status: "uploading",
          token: ++generation,
        };
        draft = null;
        dirty = false;
        home();
        queue();
        tryUpload(upload.token);
      }
      function queue() {
        const host = $("#queue");
        if (!host || !upload) return;
        host.innerHTML = `<article><h3>${escapeHtml(
          upload.photo.caption || "待上傳照片",
        )}</h3><canvas id="pending-photo" role="img"
    aria-label="留在畫面上的待上傳照片" style="max-height:160px"></canvas>
    <p role="status">${
      upload.status === "failed"
        ? "上傳失敗，已自動重試 3 次；照片仍在此頁。"
        : upload.attempt
          ? "網路中斷，準備自動重試 " + upload.attempt + "／3"
          : "上傳中…"
    }</p><div class="actions">${
      upload.status === "failed"
        ? button("手動重送（模擬網路恢復）", "retry", "primary")
        : ""
    }
    ${button("放棄這張照片", "abandon", "danger")}</div>
    <div id="abandon-confirm" class="inline-host"></div></article>`;
        paint($("#pending-photo"), fieldCanvas(upload.photo));
        bind();
      }
      function tryUpload(token) {
        setTimeout(() => {
          if (!upload || upload.token !== token) return;
          if (
            upload.scenario === "success" ||
            (upload.scenario === "recover" && upload.attempt === 3)
          ) {
            if (!state.photos.some((p) => p.id === upload.photo.id))
              state.photos.push(upload.photo);
            upload = null;
            message = "照片已上傳，已產生內業版。";
            home();
            $("#feedback [role=status]").focus({ preventScroll: true });
            return;
          }
          if (upload.attempt === 3) {
            upload.status = "failed";
            queue();
            return;
          }
          upload.attempt++;
          queue();
          setTimeout(
            () => tryUpload(token),
            [0, 1000, 2000, 4000][upload.attempt],
          );
        }, 300);
      }
      function officeDetail(id) {
        selected = state.photos.find((p) => p.id === id);
        editing = null;
        dirty = false;
        const p = selected;
        app.innerHTML = `<section class="panel">
    ${button("返回照片清單", "home", "back")}<h1>現場版與內業版</h1>
    <p>${escapeHtml(p.caption)}</p>${badge(p)}
    <div class="segmented mobile-versions">
    ${button("現場版", "version:field")}${button("內業版", "version:office")}
    </div><div class="compare">
    <figure data-version="field"><figcaption>現場版</figcaption>
    <canvas id="field-view" role="img" aria-label="現場版照片"></canvas>
    </figure><figure data-version="office"><figcaption>內業版</figcaption>
    <canvas id="office-view" role="img" aria-label="含五欄工程標示的內業版">
    </canvas></figure></div>
    <p class="muted">工程標示的比例與字型為規格設計，原型給負責人看後可調。
    標示永遠是白底黑字，深色模式也不反轉照片。</p>
    <div class="actions">${
      p.status === "active"
        ? button("編修內業版", "office-edit", "primary")
        : "<p>歷史照片僅供檢視，不能編修或刪除。</p>"
    }
    ${button("下載內業版示意圖片", "download")}</div></section>`;
        paint($("#field-view"), fieldCanvas(p));
        paint($("#office-view"), officeCanvas(p));
        setVersion(mobileVersion);
        bind();
        focusHeading();
      }
      function setVersion(value) {
        mobileVersion = value;
        document.querySelectorAll("[data-version]").forEach((el) => {
          el.hidden = innerWidth <= 640 && el.dataset.version !== value;
        });
        document
          .querySelectorAll('[data-action^="version:"]')
          .forEach((el) => {
            el.setAttribute(
              "aria-pressed",
              String(el.dataset.action === "version:" + value),
            );
          });
      }
      window.addEventListener("resize", () => setVersion(mobileVersion));
      function officeEditor() {
        editing = { ...selected.office };
        dirty = false;
        app.innerHTML = `<section class="panel"><h1>編修內業版</h1>
    <p>${escapeHtml(selected.caption)}</p>${editorMarkup(true)}
    <div class="actions" style="margin-top:20px">
    ${button("套用內業版", "apply", "primary")}
    ${button("返回兩版比較", "leave-office")}</div>
    <div id="apply-confirm" class="inline-host"></div>
    <div id="leave-confirm" class="inline-host"></div></section>`;
        bind();
        bindEditor();
        focusHeading();
      }
      function navigateOther() {
        const go = () => {
          const file =
            mode === "field"
              ? "ui-office-prototype.html"
              : "ui-field-prototype.html";
          location.href =
            file + "#" + encodeURIComponent(JSON.stringify(state));
        };
        if (dirty || draft || upload) {
          const host = $("#navigation-confirm");
          confirmAt(
            host,
            "放棄未完成操作並切換",
            "未確認的編修或待上傳照片會遺失；已上傳資料會沿用。",
            () => {
              upload = null;
              dirty = false;
              draft = null;
              go();
            },
            true,
          );
        } else go();
      }
      function bind() {
        document.querySelectorAll("[data-action]").forEach((el) => {
          if (["do-confirm", "cancel-confirm"].includes(el.dataset.action))
            return;
          el.onclick = () => act(el.dataset.action);
        });
        if ($("#filter")) {
          $("#filter").value = filter;
          $("#filter").onchange = (e) => {
            filter = e.target.value;
            home();
            $("#filter").focus({ preventScroll: true });
          };
        }
      }
      function act(action) {
        const [name, value] = action.split(":");
        if (name === "capture") return capture(value);
        if (name === "choose") {
          draft.shape = value;
          editing = cleanEdit();
          dirty = true;
          return fieldEditor();
        }
        if (name === "home") return home();
        if (name === "next") return targetForm();
        if (name === "rotate") {
          editing.rotation = (editing.rotation + 90) % 360;
          dirty = true;
          return editPreview();
        }
        if (name === "reset-edit") {
          editing = cleanEdit();
          dirty = true;
          bindEditor();
          return;
        }
        if (name === "pan") {
          const key = ["left", "right"].includes(value) ? "x" : "y";
          editing[key] = Math.max(
            -80,
            Math.min(
              80,
              editing[key] + (["left", "up"].includes(value) ? -20 : 20),
            ),
          );
          return editPreview();
        }
        if (name === "leave-editor" || name === "leave-office") {
          return confirmAt(
            $("#leave-confirm"),
            "放棄未儲存變更",
            "尚未確認的編修與輸入不會保存，已上傳照片不受影響。",
            () => {
              if (name === "leave-office") officeDetail(selected.id);
              else home();
            },
            true,
          );
        }
        if (name === "retry") {
          upload.scenario = "success";
          upload.status = "uploading";
          queue();
          return tryUpload(upload.token);
        }
        if (name === "abandon")
          return confirmAt(
            $("#abandon-confirm"),
            "確認放棄這張照片",
            "這張尚未上傳的照片將從此頁移除，需要時請重新拍攝。",
            () => {
              upload = null;
              message = "已放棄待上傳照片。";
              home();
              $("#feedback [role=status]").focus({ preventScroll: true });
            },
            true,
          );
        if (name === "modify") {
          draft = structuredClone(
            state.photos.find((p) => p.id === Number(value)),
          );
          return targetForm(true);
        }
        if (name === "delete")
          return confirmAt(
            $("#confirm-" + value),
            "確認刪除照片",
            "照片將不再計入覆蓋數，從現場清單移除；內業仍可查到已刪除紀錄。",
            () => {
              state.photos.find((p) => p.id === Number(value)).status =
                "deleted";
              message = "照片已刪除，歷史紀錄保留。";
              home();
              $("#feedback [role=status]").focus({ preventScroll: true });
            },
            true,
          );
        if (name === "open") return officeDetail(Number(value));
        if (name === "version") return setVersion(value);
        if (name === "office-edit") return officeEditor();
        if (name === "apply")
          return confirmAt(
            $("#apply-confirm"),
            "確認套用內業版",
            "會直接更新內業版，不保留舊內業版；現場版不變。",
            () => {
              selected.office = { ...editing, zoom: 1, x: 0, y: 0 };
              const id = selected.id;
              officeDetail(id);
              const note = document.createElement("p");
              note.className = "feedback";
              note.setAttribute("role", "status");
              note.textContent = "已套用內業版，現場版不變。";
              app.querySelector("section").prepend(note);
              reveal(note);
            },
          );
        if (name === "standard")
          return confirmAt(
            $("#standard-confirm"),
            "確認依新標準重新查核",
            "只將鋼筋工程的有效照片標為標準變更作廢；其他項目不變。",
            () => {
              state.photos
                .filter((p) => p.item === 0 && p.status === "active")
                .forEach((p) => {
                  p.status = "void";
                });
              state.recheck = true;
              message = "鋼筋工程已標待重查；請切換現場補拍。";
              home();
              $("#feedback [role=status]").focus({ preventScroll: true });
            },
          );
        if (name === "download") {
          const a = document.createElement("a");
          a.download = "內業版示意.jpg";
          a.href = officeCanvas(selected).toDataURL("image/jpeg", 0.9);
          a.click();
        }
      }
      $("#switch").onclick = navigateOther;
      $("#theme").onchange = (e) => {
        document.documentElement.dataset.theme = e.target.value;
        state.theme = e.target.value;
      };
      // 原型的選項支援明確方向鍵路徑，滑鼠仍沿用原生選單。
      document.addEventListener("keydown", (event) => {
        const el = event.target;
        if (
          !(el instanceof HTMLSelectElement) ||
          event.altKey ||
          event.ctrlKey ||
          event.metaKey ||
          event.shiftKey
        )
          return;
        if (!["ArrowDown", "ArrowUp", "Home", "End"].includes(event.key))
          return;
        event.preventDefault();
        const last = el.options.length - 1;
        const index =
          event.key === "Home"
            ? 0
            : event.key === "End"
              ? last
              : Math.max(
                  0,
                  Math.min(
                    last,
                    el.selectedIndex + (event.key === "ArrowDown" ? 1 : -1),
                  ),
                );
        el.selectedIndex = index;
        el.dispatchEvent(new Event("input", { bubbles: true }));
        el.dispatchEvent(new Event("change", { bubbles: true }));
      });
      window.addEventListener("beforeunload", (e) => {
        if (dirty || draft || upload) {
          e.preventDefault();
          e.returnValue = "";
        }
      });
      // URL 只攜帶已上傳示意資料與參數，兩份原型可接續狀態。
      // 未確認草稿、待上傳照片、圖片位元組不進 URL 或持久儲存。
      async function boot() {
        $("#theme").value = state.theme || "light";
        document.documentElement.dataset.theme = state.theme || "light";
        const raw = $("#label-font").textContent.replace(/\s/g, "");
        const font = new FontFace(
          "EvidenceLabel",
          "url(data:font/woff2;base64," + raw + ")",
        );
        document.fonts.add(await font.load());
        await loadPictures();
        home();
        document.body.dataset.ready = "true";
      }
      boot().catch(() => {
        app.innerHTML = '<p role="alert">原型初始化失敗，請重新開啟檔案。</p>';
      });
    </script>
  </body>
</html>
