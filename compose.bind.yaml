# 選用 overlay：以主機資料夾取代具名 volume。
# 先在 .env 設定 INSPECTFLOW_DATA_DIR 與 INSPECTFLOW_UPLOADS_DIR。
services:
  migrate:
    volumes:
      - ${INSPECTFLOW_DATA_DIR:?Set INSPECTFLOW_DATA_DIR in .env}:/data

  initialize:
    volumes:
      - ${INSPECTFLOW_DATA_DIR:?Set INSPECTFLOW_DATA_DIR in .env}:/data

  app:
    volumes:
      - ${INSPECTFLOW_DATA_DIR:?Set INSPECTFLOW_DATA_DIR in .env}:/data
      - ${INSPECTFLOW_UPLOADS_DIR:?Set INSPECTFLOW_UPLOADS_DIR in .env}:/uploads
