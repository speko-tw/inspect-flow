<title>權限管理原型</title>
<style>
:root{
 color-scheme:light;
 --navy:#002060;--yellow:#ffc200;--canvas:#f3f6fa;--paper:#ffffff;
 --ink:#101828;--muted:#536174;--line:#d4dce7;--line-control:#7d8a9a;
 --raised:#ffffff;--soft:#eaf0f7;--link:#174f9b;--focus:#1670a6;
 --success:#176b3a;--success-bg:#e6f5eb;--warning:#765000;
 --warning-bg:#fff3cf;--danger:#a12b25;--danger-bg:#fff0ed;
 --info:#00577d;--info-bg:#e5f4fb;--neutral:#46566b;
 --neutral-bg:#edf1f5;--inverse:#ffffff;--accent-ink:#202b3b;
 --shadow-header:0 1px 0 rgb(16 24 40 / 6%);
 --shadow-panel:0 2px 6px rgb(20 38 66 / 5%),0 12px 28px rgb(20 38 66 / 4%);
 --shadow-focus:0 0 0 3px rgb(22 112 166 / 24%);
 --header-rule:rgb(255 255 255 / 38%);
 --header-outline:rgb(255 255 255 / 46%);
 --header-outline-soft:rgb(255 255 255 / 45%);
 --header-wash:rgb(255 255 255 / 8%);
 --font:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
 --radius-sm:4px;--radius-md:8px;--radius-lg:12px;
 --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;
 --space-5:20px;--space-6:24px;--space-8:32px;--motion-fast:130ms;
}
@media (prefers-color-scheme: dark){
 :root:not([data-theme="light"]){
  color-scheme:dark;
  --canvas:#0b1422;--paper:#111f32;--raised:#172941;--soft:#1c3049;
  --ink:#eff4fb;--muted:#b8c5d6;--line:#344960;--line-control:#8298b2;
  --link:#aad0ff;--focus:#82c9f2;--success:#8de1aa;
  --success-bg:#153b2a;--warning:#ffda82;--warning-bg:#45371a;
  --danger:#ffaaa0;--danger-bg:#482722;--info:#9cddf3;
  --info-bg:#15384b;--neutral:#c2cfdd;--neutral-bg:#283a4e;
  --shadow-header:0 1px 0 rgb(255 255 255 / 7%);
  --shadow-panel:0 8px 28px rgb(0 0 0 / 18%);
  --shadow-focus:0 0 0 3px rgb(130 201 242 / 24%);
  --header-rule:rgb(255 255 255 / 38%);
  --header-outline:rgb(255 255 255 / 46%);
  --header-outline-soft:rgb(255 255 255 / 45%);
  --header-wash:rgb(255 255 255 / 8%);
 }
}
:root[data-theme="dark"]{
 color-scheme:dark;
 --canvas:#0b1422;--paper:#111f32;--raised:#172941;--soft:#1c3049;
 --ink:#eff4fb;--muted:#b8c5d6;--line:#344960;--line-control:#8298b2;
 --link:#aad0ff;--focus:#82c9f2;--success:#8de1aa;
 --success-bg:#153b2a;--warning:#ffda82;--warning-bg:#45371a;
 --danger:#ffaaa0;--danger-bg:#482722;--info:#9cddf3;
 --info-bg:#15384b;--neutral:#c2cfdd;--neutral-bg:#283a4e;
 --shadow-header:0 1px 0 rgb(255 255 255 / 7%);
 --shadow-panel:0 8px 28px rgb(0 0 0 / 18%);
 --shadow-focus:0 0 0 3px rgb(130 201 242 / 24%);
 --header-rule:rgb(255 255 255 / 38%);
 --header-outline:rgb(255 255 255 / 46%);
 --header-outline-soft:rgb(255 255 255 / 45%);
 --header-wash:rgb(255 255 255 / 8%);
}
*{box-sizing:border-box}
html{scrollbar-gutter:stable}
body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.58 var(--font)}
button,input,select{font:inherit}
button,select,input{touch-action:manipulation}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;box-shadow:var(--shadow-focus)}
[hidden]{display:none!important}
.topbar{position:sticky;top:0;z-index:20;background:var(--navy);color:var(--inverse);border-bottom:3px solid var(--yellow);box-shadow:var(--shadow-header)}
.topbar-inner{max-width:1480px;min-height:68px;margin:auto;padding:10px 28px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:11px;min-width:0;font-weight:760;letter-spacing:.02em}
.brand-mark{display:grid;place-items:center;width:34px;height:34px;background:var(--yellow);color:var(--accent-ink);font-size:13px;font-weight:900;border-radius:var(--radius-sm)}
.brand-name{font-size:17px}
.brand-context{padding-left:12px;border-left:1px solid var(--header-rule);font-size:13px;font-weight:500;color:var(--inverse)}
.topbar-tools{display:flex;align-items:center;gap:10px;margin-left:auto}
.demo-label{padding:4px 9px;border:1px solid var(--header-outline);border-radius:var(--radius-sm);font-size:12px;color:var(--inverse)}
.theme-button,.header-select{min-height:42px;border:1px solid var(--header-outline-soft);border-radius:var(--radius-sm);background:var(--header-wash);color:var(--inverse);padding:8px 11px}
.header-select option{background:var(--paper);color:var(--ink)}
.workspace{max-width:1480px;min-height:calc(100vh - 71px);margin:auto;display:grid;grid-template-columns:250px minmax(0,1fr)}
.rail{padding:23px 15px 28px 24px;border-right:1px solid var(--line);background:var(--paper)}
.rail-heading{margin:0 0 4px;font-size:20px;letter-spacing:-.02em}
.rail-subtitle{margin:0 0 18px;color:var(--muted);font-size:13px}
.model-note{padding:12px 13px;margin:0 0 18px;border-left:3px solid var(--yellow);background:var(--soft);font-size:12px;line-height:1.55;color:var(--muted)}
.model-note strong{display:block;margin-bottom:3px;color:var(--ink);font-size:13px}
.nav-list{display:grid;gap:3px}
.nav-button{display:flex;align-items:center;gap:10px;min-height:44px;width:100%;padding:9px 11px;border:1px solid transparent;border-radius:var(--radius-sm);background:transparent;color:var(--muted);text-align:left}
.nav-button:hover{background:var(--soft);color:var(--ink)}
.nav-button[aria-current="page"]{border-left:3px solid var(--yellow);background:var(--soft);color:var(--navy);font-weight:700}
:root[data-theme="dark"] .nav-button[aria-current="page"]{color:var(--ink)}
.nav-symbol{display:grid;place-items:center;width:23px;height:23px;border:1px solid var(--line-control);border-radius:50%;font-size:11px;font-weight:800}
.persona-box{margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
.persona-box label,.form-label{display:block;margin-bottom:6px;font-size:13px;font-weight:700}
.persona-box select,.control,.select-control{width:100%;min-height:44px;padding:9px 11px;border:1px solid var(--line-control);border-radius:var(--radius-sm);background:var(--paper);color:var(--ink)}
.persona-description{margin:8px 0 0;color:var(--muted);font-size:12px}
main{min-width:0;padding:28px 34px 50px}
.breadcrumb{display:flex;align-items:center;gap:8px;margin-bottom:7px;color:var(--muted);font-size:12px}
.breadcrumb-mark{width:18px;height:3px;background:var(--yellow)}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin:0 0 22px}
.page-head h1{margin:0;font-size:26px;line-height:1.32;letter-spacing:-.025em}
.page-head p{max-width:720px;margin:7px 0 0;color:var(--muted);font-size:14px}
.page-head-actions{display:flex;gap:8px;flex-wrap:wrap}
.view-switch{display:flex;gap:4px;padding:4px;margin:0 0 17px;border-bottom:1px solid var(--line);overflow-x:auto}
.view-switch button{min-height:42px;padding:8px 14px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);white-space:nowrap}
.view-switch button[aria-current="page"]{border-bottom-color:var(--yellow);color:var(--ink);font-weight:700}
.panel{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow-panel)}
.panel-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.panel-heading h2,.panel-heading h3{margin:0;font-size:17px;line-height:1.35}
.panel-heading p{margin:5px 0 0;color:var(--muted);font-size:13px}
.panel-body{padding:18px 20px}
.people-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(260px,.7fr);gap:18px;align-items:start}
.people-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.person-summary{display:flex;align-items:center;gap:12px;padding:13px 15px;margin-bottom:17px;background:var(--soft);border-left:3px solid var(--navy)}
.avatar{flex:0 0 38px;width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:var(--navy);color:var(--inverse);font-weight:750}
.person-summary strong{display:block}
.person-summary small{display:block;color:var(--muted);font-size:12px}
.state-pill{margin-left:auto;padding:3px 8px;border:1px solid var(--success);border-radius:99px;color:var(--success);font-size:11px;white-space:nowrap}
.permission-module{margin:0 0 16px;border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden}
.module-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;background:var(--soft);border-bottom:1px solid var(--line)}
.module-heading strong{font-size:14px}
.module-heading span{color:var(--muted);font-size:12px}
.permission-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.permission-row:last-child{border-bottom:0}
.permission-main{display:flex;align-items:flex-start;gap:11px;min-width:0}
.permission-checkbox{flex:0 0 20px;width:20px;height:20px;margin:3px 0 0;accent-color:var(--navy)}
.permission-name{font-size:14px;font-weight:700}
.permission-meta{display:block;margin-top:2px;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.permission-source{padding:3px 7px;border-radius:var(--radius-sm);background:var(--neutral-bg);color:var(--neutral);font-size:11px;white-space:nowrap}
.permission-source.implied{background:var(--info-bg);color:var(--info)}
.permission-source.backfill{background:var(--warning-bg);color:var(--warning)}
.permission-row.is-restricted{background:var(--canvas)}
.permission-row.is-restricted .permission-name{color:var(--muted)}
.inline-confirm{grid-column:1/-1;padding:13px 14px;margin-top:4px;border-left:3px solid var(--warning);background:var(--warning-bg);color:var(--ink)}
.inline-confirm h4{margin:0 0 4px;font-size:14px}
.inline-confirm p{margin:3px 0 10px;font-size:13px}
.impact-list{display:grid;gap:4px;padding-left:18px;margin:7px 0 12px;font-size:13px}
.confirm-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:9px 14px;border:1px solid var(--line-control);border-radius:var(--radius-sm);background:var(--paper);color:var(--ink);font-weight:650;text-decoration:none}
.button:hover{background:var(--soft)}
.button.primary{border-color:var(--navy);background:var(--navy);color:var(--inverse)}
.button.primary:hover{opacity:.9}
.button.danger{border-color:var(--danger);background:var(--danger);color:var(--inverse)}
.button.quiet{border-color:transparent;background:transparent;color:var(--link)}
.button.small{min-height:36px;padding:6px 10px;font-size:13px}
.button:disabled,select:disabled,input:disabled{cursor:not-allowed;opacity:.57}
.status{padding:11px 13px;border-left:3px solid var(--info);background:var(--info-bg);color:var(--ink);font-size:13px}
.status.success{border-color:var(--success);background:var(--success-bg)}
.status.warning{border-color:var(--warning);background:var(--warning-bg)}
.status.error{border-color:var(--danger);background:var(--danger-bg)}
.note{color:var(--muted);font-size:12px}
.mini-stat{padding:15px 16px;border-bottom:1px solid var(--line)}
.mini-stat:last-child{border-bottom:0}
.mini-stat strong{display:block;font-size:20px;line-height:1.2}
.mini-stat span{display:block;margin-top:4px;color:var(--muted);font-size:12px}
.side-panel-title{padding:16px 17px 12px;border-bottom:1px solid var(--line)}
.side-panel-title h3{margin:0;font-size:15px}
.side-panel-title p{margin:4px 0 0;color:var(--muted);font-size:12px}
.person-options{display:grid;gap:8px;padding:14px}
.person-option{display:flex;align-items:center;gap:10px;width:100%;padding:9px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper);color:var(--ink);text-align:left}
.person-option[aria-pressed="true"]{border-color:var(--navy);box-shadow:inset 3px 0 0 var(--yellow)}
.person-option .avatar{width:32px;height:32px;flex-basis:32px;font-size:12px}
.person-option small{display:block;color:var(--muted);font-size:11px}
.action-bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:16px}
.two-column{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.stack{display:grid;gap:15px}
.field{min-width:0}
.field label{display:block;margin-bottom:6px;font-size:13px;font-weight:700}
.field-help{margin:5px 0 0;color:var(--muted);font-size:12px}
.input-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.table-wrap{max-width:100%;overflow-x:auto}
.data-table{width:100%;border-collapse:collapse;text-align:left}
.data-table th,.data-table td{padding:12px 13px;border-bottom:1px solid var(--line);vertical-align:middle}
.data-table th{background:var(--soft);color:var(--muted);font-size:12px;font-weight:700}
.data-table td{font-size:13px}
.data-table tr:last-child td{border-bottom:0}
.badge{display:inline-flex;align-items:center;min-height:24px;padding:3px 8px;border-radius:99px;background:var(--neutral-bg);color:var(--neutral);font-size:11px;white-space:nowrap}
.badge.good{background:var(--success-bg);color:var(--success)}
.badge.warn{background:var(--warning-bg);color:var(--warning)}
.badge.info{background:var(--info-bg);color:var(--info)}
.badge.bad{background:var(--danger-bg);color:var(--danger)}
.bundle-grid,.role-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.bundle-item,.role-item{min-width:0;padding:15px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper)}
.bundle-item.selected,.role-item.selected{border-color:var(--navy);box-shadow:inset 3px 0 0 var(--yellow)}
.bundle-item h3,.role-item h3{margin:0;font-size:15px}
.bundle-item p,.role-item p{margin:5px 0 10px;color:var(--muted);font-size:12px}
.code-list{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0 12px}
.code-chip{max-width:100%;padding:4px 7px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--soft);font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}
.check-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px}
.check-row{display:flex;align-items:flex-start;gap:8px;padding:7px 0;font-size:13px}
.check-row input{width:18px;height:18px;flex:0 0 18px;margin:2px 0 0;accent-color:var(--navy)}
.card-actions{display:flex;gap:6px;flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(210px,.65fr);gap:18px}
.form-panel{padding:17px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--paper)}
.form-panel h3{margin:0 0 13px;font-size:16px}
.empty-state{padding:30px 22px;text-align:center;border:1px dashed var(--line-control);border-radius:var(--radius-md);background:var(--paper)}
.empty-mark{display:grid;place-items:center;width:42px;height:42px;margin:0 auto 12px;border:2px solid var(--yellow);border-radius:50%;font-size:18px;font-weight:800}
.empty-state h2{margin:0;font-size:18px}
.empty-state p{max-width:500px;margin:8px auto 16px;color:var(--muted);font-size:13px}
.project-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden}
.project-summary>div{padding:13px;border-right:1px solid var(--line)}
.project-summary>div:last-child{border-right:0}
.project-summary strong{display:block;font-size:14px}
.project-summary span{display:block;margin-top:2px;color:var(--muted);font-size:11px}
.error-detail{margin-top:11px;padding:12px;border:1px solid var(--danger);border-radius:var(--radius-sm);background:var(--danger-bg)}
.error-detail strong{display:block;color:var(--danger)}
.error-detail code{display:block;margin-top:4px;overflow-wrap:anywhere;font-size:12px}
.rule-callout{padding:14px 15px;border-left:3px solid var(--navy);background:var(--soft);font-size:13px}
.role-settings{display:grid;gap:10px}
.role-setting{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
.role-setting:last-child{border-bottom:0}
.role-setting p{margin:3px 0 0;color:var(--muted);font-size:12px}
.toggle{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:36px}
.toggle input{width:20px;height:20px;accent-color:var(--navy)}
.toast{position:fixed;right:22px;bottom:18px;z-index:40;max-width:min(420px,calc(100vw - 28px));padding:12px 15px;border:1px solid var(--line-control);border-radius:var(--radius-sm);background:var(--paper);color:var(--ink);box-shadow:var(--shadow-panel)}
.toast:empty{display:none}
.footer-note{max-width:1480px;margin:0 auto;padding:12px 28px 24px;color:var(--muted);font-size:11px}
@media(max-width:980px){
 .workspace{grid-template-columns:210px minmax(0,1fr)}
 main{padding:24px 22px 42px}
 .people-layout{grid-template-columns:minmax(0,1fr)}
 .people-side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:680px){
 .topbar-inner{min-height:60px;padding:8px 12px;gap:9px}
 .brand-context{display:none}
 .brand-name{font-size:15px}
 .brand-mark{width:30px;height:30px}
 .topbar-tools{gap:6px}
 .demo-label{font-size:10px;padding:3px 6px}
 .theme-button{min-height:40px;padding:7px 9px;font-size:12px}
 .header-select{max-width:120px;min-height:40px;padding:6px;font-size:12px}
 .workspace{display:block;min-height:0}
 .rail{padding:13px 12px 10px;border-right:0;border-bottom:1px solid var(--line)}
 .rail-heading{font-size:17px}
 .rail-subtitle{display:none}
 .model-note{padding:8px 10px;margin:8px 0 10px;font-size:11px}
 .model-note strong{display:inline;margin-right:6px}
 .nav-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
 .nav-button{min-height:42px;padding:7px 8px;font-size:12px}
 .nav-symbol{width:20px;height:20px;flex:0 0 20px}
 .persona-box{display:grid;grid-template-columns:75px minmax(0,1fr);gap:7px;align-items:center;margin-top:10px;padding-top:10px}
 .persona-box label{margin:0;font-size:12px}
 .persona-box select{min-height:40px;padding:7px;font-size:12px}
 .persona-description{grid-column:1/-1;margin:0;font-size:11px}
 main{padding:17px 12px 30px}
 .breadcrumb{margin-bottom:5px}
 .page-head{display:block;margin-bottom:16px}
 .page-head h1{font-size:22px}
 .page-head-actions{margin-top:10px}
 .page-head p{font-size:13px}
 .panel-heading{padding:14px 13px 11px}
 .panel-heading h2{font-size:16px}
 .panel-body{padding:13px}
 .two-column,.form-grid,.input-row,.bundle-grid,.role-grid,.check-list{grid-template-columns:minmax(0,1fr)}
 .people-toolbar{display:block}
 .people-toolbar .control{margin-top:7px}
 .person-summary{padding:10px}
 .permission-row{grid-template-columns:minmax(0,1fr);gap:6px;padding:11px}
 .permission-source{justify-self:start;margin-left:31px}
 .permission-meta{font-size:11px}
 .inline-confirm{grid-column:1;padding:11px}
 .confirm-actions .button{flex:1 1 120px}
 .people-side{display:block}
 .project-summary{grid-template-columns:minmax(0,1fr)}
 .project-summary>div{border-right:0;border-bottom:1px solid var(--line)}
 .project-summary>div:last-child{border-bottom:0}
 .table-wrap{overflow:visible}
 .data-table,.data-table tbody,.data-table tr,.data-table td{display:block;width:100%}
 .data-table thead{display:none}
 .data-table tr{padding:9px 0;border-bottom:1px solid var(--line)}
 .data-table td{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;padding:6px 3px;border:0}
 .data-table td:before{content:attr(data-label);color:var(--muted);font-size:11px;font-weight:700}
 .action-bar{align-items:stretch}
 .action-bar .button{flex:1 1 130px}
 .role-setting{grid-template-columns:minmax(0,1fr) auto;padding:10px 8px}
 .footer-note{padding:12px}
}
@media(max-width:390px){
 .brand-name{font-size:14px}
 .topbar-inner{gap:6px}
 .topbar-tools{gap:4px}
 .theme-button{max-width:76px;white-space:normal;line-height:1.2}
 .demo-label{max-width:62px;text-align:center}
 .nav-button{gap:6px}
}
.tour{position:fixed;right:18px;bottom:18px;z-index:30;width:min(400px,calc(100vw - 24px));max-height:min(70vh,560px);display:flex;flex-direction:column;background:var(--paper);color:var(--ink);border:1px solid var(--line-control);border-top:4px solid var(--yellow);border-radius:var(--radius-md);box-shadow:var(--shadow-panel)}
.tour-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 15px 8px}
.tour-step{color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.04em}
.tour-toggle{min-height:36px;padding:5px 10px;border:1px solid var(--line-control);border-radius:var(--radius-sm);background:var(--paper);color:var(--ink);font-size:12px}

function diagnosticResult(){
 const name=state.diagnostic.person,action=state.diagnostic.action,user=users[name];
 if(user&&user.is_admin)return {ok:true,missing:[],message:"系統管理者可執行此動作。"};
 const codes=permissionState[name]||[],roles=assignedRoles(name);
 const moduleNeed={inspection:["inspection.use"],create:["project.create"],template:["template.manage"],members:["project.use"]}[action]||[];
 const roleNeed={inspection:"現場工程師",members:"專案工程師"}[action];
 const roleOk={inspection:["現場工程師","專案工程師","專案查閱人員"],members:["專案工程師"]}[action]||[];
 const missing=[];
 if(action==="create"&&user&&user.kind==="外部協作人員")missing.push({kind:"rule",label:"外部協作人員不能開設專案"});
 moduleNeed.forEach(function(code){
  if(codes.indexOf(code)<0){const item=registry.find(function(row){return row.code===code});missing.push({kind:"module",label:(item?item.label:code)+"模組權限",code:code})}
 });
 if(roleNeed&&!roles.some(function(item){return roleOk.indexOf(item.role)>=0}))missing.push({kind:"role",label:"東區排水改善工程的專案角色（例如「"+roleNeed+"」）",role:roleNeed});
 return {ok:missing.length===0,missing:missing,message:missing.length?"還差一層授權，以下列出原因和補法。":"已具備所需的模組權限與專案角色。"};
}

function modulePermissionRow(item){
 const current=hasCode(state.selectedUser,item.code);
 const impliedLocked=(item.code==="project.use"&&hasCode(state.selectedUser,"project.create"))||(item.code==="template.use"&&hasCode(state.selectedUser,"template.manage"));
 const delegate=state.persona==="templateDelegate";
 const moduleAllowed=state.persona==="admin"||(delegate&&item.module==="template");
 const selfDenied=delegate&&state.selectedUser===personaConfig[state.persona].name;
 const externalDenied=users[state.selectedUser].kind==="外部協作人員"&&!item.external;
 const delegateAdminCode=delegate&&item.code==="all_project_progress.read"&&!current;
 const disabled=impliedLocked||!moduleAllowed||selfDenied||externalDenied||delegateAdminCode;
 let reason="";
 if(impliedLocked)reason="由 "+(item.code==="project.use"?"project.create":"template.manage")+" 自動包含，須先收回該權限";
 else if(externalDenied)reason="外部協作人員不可取得此權限";
 else if(selfDenied)reason="委派者不能替自己授權";
 else if(delegateAdminCode)reason="只有 Admin 能授予此權限";
 const badge=current?'<span class="permission-source '+(item.code==="project.use"&&hasCode(state.selectedUser,"project.create")||item.code==="template.use"&&hasCode(state.selectedUser,"template.manage")?"implied":"")+'">'+(impliedLocked?"自動包含":"已授予")+'</span>':'<span class="permission-source">未授予</span>';
 let confirm="";
 if(state.pendingRevoke&&state.pendingRevoke.code===item.code){
  const impact=item.code==="project.use"?'<p>收回後仍保留專案成員身分，但此人無法再使用專案模組。</p><div><strong>目前成員身分 2 個</strong><ul class="impact-list"><li>東區排水改善工程</li><li>西側管線更新（將變成無人管理）</li></ul></div>':'<p>對象：'+esc(state.selectedUser)+'。收回後無法再使用「'+item.label+'」。專案成員與專案角色不會改變。</p>';
  confirm='<div class="inline-confirm"><h4>確認收回「'+item.label+'」？</h4>'+impact+'<div class="confirm-actions"><button class="button small" type="button" data-action="cancel-revoke">取消</button><button class="button danger small" type="button" data-action="confirm-revoke">確認收回</button></div></div>';
 }
 return '<div class="permission-row '+(disabled?"is-restricted":"")+'"><label class="permission-main"><input class="permission-checkbox" type="checkbox" data-permission="'+item.code+'" '+(current?"checked":"")+' '+(disabled?"disabled":"")+' aria-label="'+item.label+'"><span><span class="permission-name">'+item.label+'</span><span class="permission-meta">'+item.description+(reason?" "+reason:"")+'</span></span></label>'+badge+confirm+'</div>';
}

  const item=registry.find(function(entry){return entry.code===code});
  if(users[state.selectedUser].kind==="外部協作人員"&&item&&!item.external){target.checked=false;state.notice="外部協作人員不可取得 "+code+"。";render();return}
  if(state.persona==="templateDelegate"&&(item.module!=="template"||state.selectedUser===personaConfig.templateDelegate.name||code==="all_project_progress.read")){target.checked=false;state.notice="此操作超出委派範圍或不能自授，資料未變更。";render();return}
  grantCode(code);return
 }
 if(target.dataset.roleAssignable){
  const role=state.roles.find(function(item){return item.id===target.dataset.roleAssignable});role.assignable=target.checked;render();return
 }
 if(target.dataset.roleExternal){

 }
});

let tourStory=null,tourScene=0;
const demoBaseline={
 users:structuredClone(users),
 permissions:structuredClone(permissionState),
 state:structuredClone(state)
};
function resetDemoState(){
 Object.keys(users).forEach(function(name){delete users[name]});
 Object.assign(users,structuredClone(demoBaseline.users));
 Object.keys(permissionState).forEach(function(name){delete permissionState[name]});
 Object.assign(permissionState,structuredClone(demoBaseline.permissions));
 Object.assign(state,structuredClone(demoBaseline.state));
}
function applyTourSetup(setup){
 if(setup.persona&&state.persona!==setup.persona){state.persona=setup.persona;state.projectCreated=false;state.projectName=""}
 state.view=setup.view||state.view;
 if(setup.user)state.selectedUser=setup.user;
 if(setup.tab)state.projectTab=setup.tab;
 if(setup.wizard)state.wizard=Object.assign({},state.wizard,setup.wizard);
 if(setup.diagnostic)state.diagnostic=Object.assign({},state.diagnostic,setup.diagnostic);
 if(setup.advancedOpen!==undefined)state.advancedOpen=setup.advancedOpen;
 if(setup.pageAdvancedOpen!==undefined)state.pageAdvancedOpen=setup.pageAdvancedOpen;
 if(setup.inlineAdvancedOpen!==undefined)state.inlineAdvancedOpen=setup.inlineAdvancedOpen;
 state.pendingRevoke=null;state.pendingDelegation=null;state.pendingBundleDelete=null;
 state.bundleError="";state.memberError=false;state.notice="";
 render();window.scrollTo({top:0});
}
function renderTour(){
 const body=document.getElementById("tour-body");
 const prev=document.getElementById("tour-prev"),next=document.getElementById("tour-next");
 if(tourStory===null){
  document.getElementById("tour-step").textContent="情境故事 "+tourStories.length+" 則";
  body.innerHTML='<h2>選一個故事，看系統怎麼運作</h2><p class="tour-why">每個故事是一個現場情境，會自動切換到對應的身分與頁面。</p><div class="tour-list">'+tourStories.map(function(story,index){return '<button class="tour-pick" type="button" data-story="'+index+'"><span class="tour-pick-tag">'+esc(story.tag)+'</span><strong>'+esc(story.title)+'</strong><span>'+esc(story.summary)+'</span><span class="tour-pick-meta">'+story.scenes.length+' 個場景</span></button>'}).join("")+'</div>';
  prev.hidden=true;next.hidden=true;return;
 }
 const story=tourStories[tourStory],scene=story.scenes[tourScene];
 document.getElementById("tour-step").textContent=story.title+"｜"+(tourScene+1)+"／"+story.scenes.length;
 body.innerHTML=(tourScene===0?'<p class="tour-cast"><strong>登場人物：</strong>'+esc(story.cast)+'</p>':"")+'<h2>'+esc(scene.title)+'</h2><h3 class="tour-part-label">現場故事</h3><p class="tour-story">'+esc(scene.story)+'</p><p class="tour-do">請你這樣操作</p><ol class="tour-steps">'+scene.steps.map(function(item){return '<li>'+esc(item)+'</li>'}).join("")+'</ol><p class="tour-why"><strong>為什麼這樣設計：</strong>'+esc(scene.why)+'</p>';
 prev.hidden=false;next.hidden=false;
 prev.textContent=tourScene===0?"回故事清單":"上一步";
 next.textContent=tourScene===story.scenes.length-1?"看下一個故事":"下一步";
}
function openScene(storyIndex,sceneIndex){
 if(storyIndex!==tourStory)resetDemoState();
 tourStory=storyIndex;tourScene=sceneIndex;
 if(storyIndex!==null)applyTourSetup(tourStories[storyIndex].scenes[sceneIndex].setup);
 renderTour();document.getElementById("tour-body").scrollTop=0;
}
document.getElementById("tour-body").addEventListener("click",function(event){
 const pick=event.target.closest("[data-story]");if(pick)openScene(Number(pick.dataset.story),0);
});
document.getElementById("tour-prev").addEventListener("click",function(){
 if(tourStory===null)return;
 if(tourScene===0)openScene(null,0);else openScene(tourStory,tourScene-1);
});
document.getElementById("tour-next").addEventListener("click",function(){
 if(tourStory===null)return;
 const story=tourStories[tourStory];
 if(tourScene<story.scenes.length-1)openScene(tourStory,tourScene+1);
 else if(tourStory<tourStories.length-1)openScene(tourStory+1,0);
 else openScene(null,0);
});
document.getElementById("tour-toggle").addEventListener("click",function(){
 const tour=document.getElementById("tour");const collapsed=tour.classList.toggle("collapsed");
 document.body.classList.toggle("tour-collapsed",collapsed);
 this.textContent=collapsed?"展開導覽":"收合";this.setAttribute("aria-expanded",String(!collapsed));
});
document.addEventListener("toggle",function(event){
 if(event.target.matches("details.advanced-nav"))state.advancedOpen=event.target.open;
 if(event.target.matches("details.advanced-panel"))state.pageAdvancedOpen=event.target.open;
 if(event.target.matches("details.advanced-inline"))state.inlineAdvancedOpen=event.target.open;
},true);
document.body.classList.add("has-tour");
openScene(null,0);
</script>
