name: Spec change
description: 對已凍結的規格提出範圍變更或意圖變更；變更合併後才改程式碼。
type: Task
labels: ["area: specs", "needs-decision"]
body:
  - type: input
    id: spec
    attributes:
      label: 規格
      placeholder: docs/specs/<slug>/spec.md
    validations:
      required: true
  - type: dropdown
    id: level
    attributes:
      label: 變更等級
      description: 計畫調整與規格澄清不必開這個 issue，在任務的 PR 內處理即可。見 docs/specs/README.md。
      options:
        - 範圍變更（需求、驗收條件、API 契約，或把工作移到其他規格）
        - 意圖變更（原則、關鍵決策，或裁定 docs/intents/ 的待決議）
    validations:
      required: true
  - type: textarea
    id: finding
    attributes:
      label: 發現了什麼
      description: 工作中發現了什麼，讓目前的規格不對或不夠好。附上發現時的任務 issue 或 PR 連結。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建議的變更
      description: 要新增、修改、撤回或移動的需求與驗收條件編號。
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 影響
      description: 需要一起更新的其他規格、計畫與進行中的任務 issue。
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        標題用英文，內文用繁體中文。
