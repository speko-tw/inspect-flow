name: Task
description: One unit of work from a spec's plan. One task = one branch = one PR.
type: Task
body:
  - type: input
    id: spec
    attributes:
      label: Spec
      description: Write N/A for work not tied to a spec, such as process or tooling changes.
      placeholder: docs/specs/<slug>/spec.md
    validations:
      required: true
  - type: input
    id: task-id
    attributes:
      label: Plan item
      description: Task ID in plan.md. Use "spec" or "plan" when this task writes those documents, or N/A.
      placeholder: T1
    validations:
      required: true
  - type: input
    id: acceptance
    attributes:
      label: Acceptance criteria covered
      description: Write N/A when there is no spec.
      placeholder: XXX-AC01, XXX-AC02
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What this task changes, and the files or areas it owns.
    validations:
      required: true
  - type: input
    id: depends-on
    attributes:
      label: Depends on
      description: Issues that must be merged first, including issues from other specs.
      placeholder: "None, or #12"
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Set this issue as a sub-issue of the spec's tracking issue, and add the matching `area:` labels.
