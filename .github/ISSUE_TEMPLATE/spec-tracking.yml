name: Spec tracking
description: 追蹤一份規格從撰寫到完成；底下的 sub-issue 就是工作清單。
title: "[Spec] <slug>"
type: Feature
body:
  - type: input
    id: spec
    attributes:
      label: 規格
      description: 規格資料夾路徑。
      placeholder: docs/specs/<slug>/
    validations:
      required: true
  - type: input
    id: phase
    attributes:
      label: Phase
      placeholder: P0
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 目標
      description: 一兩句話說明這份規格要交付什麼。
    validations:
      required: true
  - type: textarea
    id: blocked-by
    attributes:
      label: 被擋議題
      description: 必須先裁定的 OQ-xx／G-xx，或必須先完成的 issue。沒有就寫「無」。
      placeholder: 無
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        依序加入 sub-issue：撰寫規格、撰寫計畫（小規格可合併為一個），再依計畫每個項目開一個 Task。
        標題用英文，內文用繁體中文。
