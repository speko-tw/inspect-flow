name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Consumed by `make check`'s check-postgres target (DBF-R10).
      # Points at the postgres service container below; that
      # container only ever holds this run's throwaway data, so a
      # fixed CI-only username/password here is not a secret.
      INSPECTFLOW_TEST_POSTGRES_URL: "postgresql+psycopg://inspectflow:\
        inspectflow@localhost:5432/inspectflow_test"
    services:
      postgres:
        # Pinned to the newest supported major version per
        # https://www.postgresql.org/support/versioning/ (checked
        # 2026-09-26: 18 is current, minor 18.6). Bump this image
        # tag when upgrading the target PostgreSQL version.
        # Digest verified from Docker Hub's official postgres:18 multi-platform
        # image index (18.6-trixie, checked 2026-10-02). Update manually when
        # advancing this service image; Dependabot does not update this ref.
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: inspectflow
          POSTGRES_PASSWORD: inspectflow
          POSTGRES_DB: inspectflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: backend/.python-version

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: make setup

      - run: make check
